<html lang="id">
<head>
<meta charset="utf-8">

<title>Notional Value Dashboard</title>
<style>
:root{--bg:#0e1621;--pn:#151f2e;--pn2:#1b2738;--ln:#263449;--tx:#e6edf5;--mu:#8a9bb2;--ac:#f5a524;--ac2:#3aa0ff;--gn:#2fbf71;--rd:#ef5350;--hd:#1f3350;--hdt:#e6edf5;--act:#111}
:root[data-theme=light]{--bg:#f3f5f8;--pn:#fff;--pn2:#eef2f7;--ln:#d5dce6;--tx:#17212f;--mu:#5d6c80;--ac:#c77700;--ac2:#1565c0;--gn:#1b8a4b;--rd:#c62828;--hd:#dfe8f4;--hdt:#17212f;--act:#fff}
:root[data-theme=green]{--bg:#eef1ee;--pn:#fff;--pn2:#f1f5f0;--ln:#cfd9cd;--tx:#1b2a1b;--mu:#5a6b5a;--ac:#2e7d32;--ac2:#1565c0;--gn:#2e7d32;--rd:#c62828;--hd:#2e7d32;--hdt:#fff;--act:#fff;--hb:#2e7d32;--hbt:#fff}
:root[data-theme=burgundy]{--bg:#f4eeee;--pn:#fff;--pn2:#f6eded;--ln:#dccaca;--tx:#2a1717;--mu:#755a5a;--ac:#8c1c2c;--ac2:#1565c0;--gn:#2e7d32;--rd:#c62828;--hd:#8c1c2c;--hdt:#fff;--act:#fff;--hb:#8c1c2c;--hbt:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--hb,var(--pn));color:var(--hbt,var(--tx));border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20}
h1{font-size:16px;margin:0 12px 0 0;letter-spacing:.3px}
h1 small{opacity:.75;font-weight:400;margin-left:8px;font-size:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:5px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
:root[data-theme=green] header button.pri,:root[data-theme=burgundy] header button.pri{background:#fff;color:var(--hb);border-color:#fff}
.sp{flex:1}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
.bar label{color:var(--mu);font-size:12px;display:flex;gap:5px;align-items:center}
nav{display:flex;gap:2px;padding:0 16px;background:var(--pn);border-bottom:1px solid var(--ln);overflow:auto}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--mu);white-space:nowrap}
nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
main{padding:14px 16px;width:100%}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:10px 13px}
.k b{display:block;font-size:20px;margin:2px 0}.k span{color:var(--mu);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}.k i{font-style:normal;color:var(--mu);font-size:11.5px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:10px 12px;min-width:0}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;display:flex;gap:8px;align-items:center}
canvas{width:100%;display:block}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--ln);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 9px;border-bottom:1px solid var(--ln);white-space:nowrap;text-align:right}
th{background:var(--hd);color:var(--hdt);position:sticky;top:0;z-index:2;font-weight:600;cursor:default}
th.l,td.l{text-align:left}
tr.pr td{background:var(--pn2);font-weight:700;color:var(--ac);text-align:left}
tr.tot td{font-weight:700;background:var(--pn2)}
tr.gt td{font-weight:800;background:var(--hd);color:var(--hdt)}
td.c1,th.c1{position:sticky;left:0;background:var(--pn);z-index:1;text-align:left}
th.c1{background:var(--hd);z-index:3}
tr.pr td.c1,tr.tot td.c1{background:var(--pn2)}tr.gt td.c1{background:var(--hd);color:var(--hdt)}
td.lk{cursor:pointer;color:var(--ac2)}td.lk:hover{text-decoration:underline}
.neg{color:var(--rd)}.pos{color:var(--gn)}
.note{color:var(--mu);font-size:12px;margin:6px 0}
.warn{background:rgba(245,165,36,.12);border:1px solid var(--ac);border-radius:6px;padding:7px 11px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.tip{position:fixed;pointer-events:none;background:#000d;color:#fff;padding:5px 8px;border-radius:4px;font-size:12px;z-index:50;display:none;white-space:pre}
.dz{border:2px dashed var(--ln);border-radius:8px;padding:16px;text-align:center;color:var(--mu);margin:8px 0}
.dz.over{border-color:var(--ac);color:var(--ac)}
.pg{display:flex;gap:6px;align-items:center;margin:8px 0}
input.n{width:130px;text-align:right}
.sm input{width:100px}
textarea{width:100%;min-height:90px;font-family:Consolas,monospace}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:60}
.modal.on{display:flex}.modal>div{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:16px;max-width:560px;width:92%;max-height:86vh;overflow:auto}
@media print{header,nav,.bar,.no-print{display:none}}
</style>

function dstr(v){ // -> YYYY-MM-DD
  if(v==null)return '';v=String(v).trim();
  if(/^\d{8}$/.test(v))return v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6);
  if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  if(/^\d{2}[\/\-]\d{2}[\/\-]\d{4}$/.test(v))return v.slice(6)+'-'+v.slice(3,5)+'-'+v.slice(0,2);
  if(/^\d{5}(\.\d+)?$/.test(v)){const d=new Date(Date.UTC(1899,11,30)+Math.floor(+v)*864e5);return d.toISOString().slice(0,10)}
  return ''}

function parseCSV(tx){
  tx=tx.replace(/^﻿/,'');const first=tx.split(/\r?\n/,1)[0];
  const dl=[',',';','\t'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<tx.length;i++){const ch=tx[i];
    if(q){if(ch==='"'){if(tx[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){r.push(c);c=''}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}
    else if(ch!=='\r')c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows}
async function readRows(f){
  const n=f.name.toLowerCase();
  if(/\.(csv|txt)$/.test(n))return parseCSV(await f.text());
  if(!window.XLSX)throw new Error('XLSX');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
function toTrades(rows){
  const nz=s=>String(s).toLowerCase().replace(/[^a-z0-9\/]/g,'');
  let hi=-1,ix={};
  for(let i=0;i<Math.min(rows.length,30);i++){const m={};rows[i].forEach((c,j)=>{m[nz(c)]=j});
    if(m.instrumentid!==undefined&&m.price!==undefined&&m.volume!==undefined){hi=i;ix=m;break}}
  if(hi<0)return null;
  const g=(r,k)=>ix[k]===undefined?'':r[ix[k]];
  const tr=new Map();
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const ins=String(g(r,'instrumentid')).trim();if(!ins)continue;
    const p=+g(r,'price'),v=+g(r,'volume');if(!(v>0)||isNaN(p))continue;
    const day=dstr(g(r,'tradingday'))||dstr(g(r,'tradedate'));if(!day)continue;
    const id=String(g(r,'tradeid')).trim()||('r'+i);const bs=String(g(r,'b/s')||g(r,'bs')).trim().toUpperCase().charAt(0);
    const k=day+'|'+id;let o=tr.get(k);
    if(!o){o={day,a:[id,String(g(r,'tradetime')),ins,p,v,'','','','']};tr.set(k,o)}
    const brk=String(g(r,'brokerid')).trim(),inv=String(g(r,'investorid')).trim();
    if(bs==='S'){o.a[7]=brk;o.a[8]=inv}else{o.a[5]=brk;o.a[6]=inv}}
  const out={};
  for(const o of tr.values())(out[o.day]=out[o.day]||[]).push(o.a);
  return out}
async function importOne(f){
  try{const rows=await readRows(f);const by=toTrades(rows);
    if(!by)return {ok:false,msg:f.name+': '+t('File tidak dikenali: kolom Instrument Id / Price / Volume tidak ditemukan')};
    let nt=0;const ds=Object.keys(by).sort();
    for(const d of ds){DAYS[d]=by[d];nt+=by[d].length;await kvSet('day:'+d,by[d])}
    await compactOld();
    return {ok:true,msg:f.name+': '+f0(nt)+' '+t('trade')+' / '+ds.length+' '+t('hari')+' ('+ds[0]+(ds.length>1?' … '+ds[ds.length-1]:'')+')'}}
  catch(e){return {ok:false,msg:f.name+': '+(e.message==='XLSX'?'Library SheetJS belum termuat (perlu internet) — simpan file sebagai CSV lalu import ulang.':e.message)}}}

function drill(f){S.dx=f;S.page=0;S.dq='';S.tab='det';render()}
const DCOL=[['d','Tanggal','l'],['brk','Broker Id','l'],['inv','Investor Id','l'],['ins','Instrumen','l'],['p','Harga Trade'],['pu','Harga (USD)'],['v','Volume'],['size','Ukuran kontrak'],['usd','Notional (USD)'],['rate','Kurs USD/IDR'],['idr','Notional (IDR)'],['tm','Waktu','l'],['id','Trade','l'],['x','Cross','l']];
function detRows(){
  let rs=recs();const f=S.dx;
  if(f){rs=rs.filter(r=>(!f.d||r.d===f.d)&&(!f.ins||r.ins===f.ins)&&(!f.inv||r.inv===f.inv)&&(!f.brk||r.brk===f.brk)&&(!f.months||(f.months.includes(+r.d.slice(5,7)-1)&&+r.d.slice(0,4)===f.year)))}
  const q=S.dq.trim().toLowerCase();if(q)rs=rs.filter(r=>(r.d+' '+r.brk+' '+r.inv+' '+r.ins+' '+r.id).toLowerCase().includes(q));
  const [sk,sd]=S.sort;rs=rs.slice().sort((a,b)=>{const va=sk==='pu'?a.p/a.dv:a[sk],vb=sk==='pu'?b.p/b.dv:b[sk];return (va<vb?-1:va>vb?1:0)*sd});
  return rs}
function dval(r,c){switch(c){case 'p':return r.p;case 'pu':return r.p/r.dv;case 'v':return f0(r.v);case 'size':return f0(r.size);case 'usd':return f2(r.usd);case 'rate':return f0(r.rate);case 'idr':return f0(r.idr);case 'x':return r.x?'X':'';default:return esc(r[c])}}
function tDet(){
  const rs=detRows(),PS=100,np=Math.max(1,Math.ceil(rs.length/PS));if(S.page>=np)S.page=np-1;
  const fl=S.dx?Object.entries(S.dx).filter(([k,v])=>v!==''&&v!=null&&k!=='year').map(([k,v])=>k+'='+(Array.isArray(v)?v.map(i=>MN()[i].slice(0,3)).join('/')+' '+S.dx.year:v)).join(' · '):'';

  x+='<div class="tw"><table><tr>'+DCOL.map(c=>'<th class="'+(c[2]||'')+'" data-s="'+c[0]+'" style="cursor:pointer">'+t(c[1])+(S.sort[0]===c[0]?(S.sort[1]>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr>';

  $('#main').innerHTML=rs.length||S.dq||S.dx?x:'<div class="note">'+t('Belum ada data. Klik Import Trade Fill atau Muat contoh.')+'</div>';
  const q=$('#dq');if(q){q.oninput=()=>{S.dq=q.value;S.page=0;const p=q.selectionStart;tDet();const n=$('#dq');n.focus();n.setSelectionRange(p,p)}}

function fname(ext){const ds=Object.keys(DAYS).sort();return 'notional-value_'+(ds[0]||'')+(ds.length>1?'_'+ds[ds.length-1]:'')+'.'+ext}
function aoaSummary(){const rs=recs();const A=[[t('Total Notional (IDR)'),'',t('Total Volume (lot)'),t('Jumlah Trade')]];
  A[0]=['Notional Value',''];A.push([]);
  const tt=rs.reduce((a,r)=>(a.v+=r.v,a.usd+=r.usd,a.idr+=r.idr,a),{v:0,usd:0,idr:0});
  A.push([t('Total Notional (IDR)'),tt.idr],[t('Total Notional (USD)'),tt.usd],[t('Total Volume (lot)'),tt.v],[t('Jumlah Trade'),rs.length],[],[t('Produk'),t('Volume'),t('Notional (USD)'),t('Notional (IDR)'),t('Pangsa')]);
  for(const o of [...sumBy(rs,r=>r.pr).values()].sort((a,b)=>prodOrder(a.k)-prodOrder(b.k)))A.push([o.k+' — '+prodName(o.k),o.v,o.usd,o.idr,tt.idr?o.idr/tt.idr:0]);
  A.push([t('Total'),tt.v,tt.usd,tt.idr,1]);return A}
function aoaDay(){const rows=dayRows();const pl=[...new Set(rows.flatMap(o=>Object.keys(o.p)))].sort((a,b)=>prodOrder(a)-prodOrder(b));
  const A=[[t('Tanggal'),t('Kurs USD/IDR'),t('Trade'),t('Volume'),t('Notional (USD)'),t('Notional (IDR)'),...pl.flatMap(p=>[p+' Vol',p+' IDR'])]];
  for(const o of rows)A.push([o.d,o.rate,o.n,o.v,o.usd,o.idr,...pl.flatMap(p=>[o.p[p]?o.p[p].v:'',o.p[p]?o.p[p].idr:''])]);return A}
function aoaMQ(){const D=mqData(),P=D.P;const A=[[t('Kontrak'),...P.flatMap(p=>[p.l+' - '+S.year,'']),t('Total Volume per Produk'),t('Total Notional (IDR)')],[t('Bulan Kontrak'),...P.flatMap(()=>[t('Volume'),t('Notional (IDR)')]),'','']];
  const merges=[];P.forEach((p,i)=>merges.push({s:{r:0,c:1+i*2},e:{r:0,c:2+i*2}}));
  const G=P.map(()=>[0,0]);let GV=0,GI=0;
  for(const [pr,cs] of D.prods){A.push([pr+' ('+prodName(pr)+')']);const PT=P.map(()=>[0,0]);let TV=0,TI=0;
    for(const c of cs){let rv=0,ri=0;const row=[c.ins];c.cells.forEach((z,i)=>{row.push(z.v||'',z.idr||'');rv+=z.v;ri+=z.idr;PT[i][0]+=z.v;PT[i][1]+=z.idr});row.push(rv,ri);A.push(row);TV+=rv;TI+=ri}
    A.push(['Total '+pr,...PT.flatMap(z=>z),TV,TI]);PT.forEach((z,i)=>{G[i][0]+=z[0];G[i][1]+=z[1]});GV+=TV;GI+=TI}
  A.push([t('Total'),...G.flatMap(z=>z),GV,GI]);return {A,merges}}
function aoaCM(){const rs=recs(),T=rs.reduce((a,r)=>a+r.idr,0);const A=[[t('Broker Id'),t('Investor Id'),t('Trade'),t('Volume'),t('Notional (USD)'),t('Notional (IDR)'),t('Pangsa')]];
  const cm=[...sumBy(rs,r=>r.brk||'—').values()].sort((a,b)=>b.idr-a.idr);
  for(const c of cm){A.push([c.k,'(total)',c.n,c.v,c.usd,c.idr,T?c.idr/T:0]);
    for(const i of [...sumBy(rs.filter(r=>(r.brk||'—')===c.k),r=>r.inv||'—').values()].sort((a,b)=>b.idr-a.idr))A.push([c.k,i.k,i.n,i.v,i.usd,i.idr,T?i.idr/T:0])}
  return A}
function aoaDet(){const rs=recs().slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.tm<b.tm?-1:1));
  return [['Date','Broker Id','Investor Id','Instrument Id','Price Trade','Price (USD)','Volume','Contract size','Notional Value (USD)','Conversion Rate (USD to IDR)','Notional Value (IDR)','Trade Time','Trade Id','Crosstrade'],
   ...rs.map(r=>[r.d,r.brk,r.inv,r.ins,r.p,r.p/r.dv,r.v,r.size,r.usd,r.rate,r.idr,r.tm,r.id,r.x?'X':''])]}
function aoaYr(){const cur=yearData();const A=[[t('Produk'),t('Volume')+' '+CFG.prYear,t('Volume')+' '+S.year,t('Total Volume'),t('Notional (IDR)')+' '+S.year]];let a=0,b=0,c=0;
  const codes=[...new Set([...PRODS.map(p=>p[0]),...cur.keys()])].sort((x,y)=>prodOrder(x)-prodOrder(y));
  for(const k of codes){const p=+CFG.prior[k]||0,o=cur.get(k)||{v:0,idr:0};A.push([k+' ('+prodName(k)+')',p,o.v,p+o.v,o.idr]);a+=p;b+=o.v;c+=o.idr}A.push([t('Total'),a,b,a+b,c]);return A}
function exportXls(){
  if(!window.XLSX){alert(t('Ekspor Excel gagal (library belum termuat — perlu internet).'));return}
  const wb=XLSX.utils.book_new();const add=(n,A,m,w)=>{const ws=XLSX.utils.aoa_to_sheet(A);if(m)ws['!merges']=m;if(w)ws['!cols']=w;XLSX.utils.book_append_sheet(wb,ws,n)};
  add(t('Ringkasan'),aoaSummary(),null,[{wch:34},{wch:18},{wch:20},{wch:22},{wch:10}]);
  add(t('Harian'),aoaDay());
  const mq=aoaMQ();add('Monthly & Quarterly',mq.A,mq.merges,[{wch:24}]);
  add('CM-Investor',aoaCM());add(t('Tahunan'),aoaYr());add('Detail',aoaDet());
  XLSX.writeFile(wb,fname('xlsx'))}
function exportPdf(){
  if(!window.jspdf||!(window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable)){alert(t('Ekspor PDF gagal (library belum termuat — perlu internet).'));return}
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  const fmt=A=>A.map((r,i)=>i===0?r:r.map(c=>typeof c==='number'?(Math.abs(c)<1&&c!==0?c.toFixed(3):f0(c)):c));
  const TC={green:[46,125,50],burgundy:[140,28,44],dark:[31,51,80],light:[31,51,80]}[CFG.theme]||[46,125,50];
  doc.setFillColor(TC[0],TC[1],TC[2]);doc.rect(0,0,842,44,'F');doc.setTextColor(255,255,255);doc.setFontSize(16);doc.text('Notional Value Report',36,28);doc.setTextColor(0,0,0);
  let y=62;doc.setFontSize(9);
  const ds=Object.keys(DAYS).sort();doc.text((ds[0]||'')+(ds.length>1?' - '+ds[ds.length-1]:'')+'  |  '+(S.prod||t('Semua'))+'  |  '+(S.brk||t('Semua'))+'  |  Side: '+CFG.basis+(CFG.xon?'  |  excl. crosstrade':''),36,y+14);
  const tb=(title,A)=>{const st=(doc.lastAutoTable?doc.lastAutoTable.finalY:y+14)+22;doc.setFontSize(11);doc.text(title,36,st);
    doc.autoTable({startY:st+6,head:[A[0]],body:fmt(A).slice(1),styles:{fontSize:7.5,cellPadding:2.5},headStyles:{fillColor:TC,textColor:255},alternateRowStyles:{fillColor:[240,240,240]},margin:{left:36,right:36}})};
  tb(t('Ringkasan per produk'),aoaSummary().slice(7));
  tb(t('Harian'),aoaDay());
  const D=mqData(),P=D.P;const A=[[t('Kontrak'),...P.map(p=>p.l),t('Total')]];
  for(const [pr,cs] of D.prods){const tot=P.map(()=>0);for(const c of cs)c.cells.forEach((z,i)=>tot[i]+=z.idr);A.push([pr,...tot,tot.reduce((a,b)=>a+b,0)])}
  tb(t('Produk × bulan (Notional IDR)')+' '+S.year,A);
  tb(t('Per CM / Investor'),aoaCM().filter(r=>r[1]==='(total)').map(r=>[r[0],r[2],r[3],r[4],r[5],r[6]]).reduce((a,r)=>{a.push(r);return a},[[t('Broker Id'),t('Trade'),t('Volume'),t('Notional (USD)'),t('Notional (IDR)'),t('Pangsa')]]));
  tb(t('Tahunan')+' '+S.year,aoaYr());
  doc.save(fname('pdf'))}
/* ================= init ================= */
async function init(){
  const c=await kvGet('cfg');if(c){CFG=Object.assign({},DEF,c);CFG.size=Object.assign({},DEF.size,c.size);CFG.div=Object.assign({},DEF.div,c.div);CFG.rates=Object.assign({},c.rates||{});CFG.prior=Object.assign({},c.prior||{})}
  for(const k of await kvKeys())if(String(k).startsWith('day:')){const v=await kvGet(k);if(v)DAYS[String(k).slice(4)]=v}
  document.documentElement.dataset.theme=CFG.theme;$('#lang').value=CFG.lang;$('#theme').value=CFG.theme;
  setRanges();applyLang();render();
  if(FSA){$('#bSync').style.display='';DIRH=(await kvGet('dirh'))||null;if(DIRH){try{if(await DIRH.queryPermission({mode:'read'})==='granted')syncFolder(false)}catch(e){}}if(S.tab==='set')render()}}
$('#bSync').onclick=()=>DIRH?syncFolder(true):pickFolder();
$('#bImp').onclick=()=>$('#fIn').click();
$('#fIn').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f)};
$('#bSample').onclick=async()=>{if(!SAMPLE)return;DAYS[SAMPLE.day]=SAMPLE.rows;await kvSet('day:'+SAMPLE.day,SAMPLE.rows);setRanges();dirty();render()};
$('#bXls').onclick=exportXls;$('#bPdf').onclick=exportPdf;
$('#lang').onchange=e=>{CFG.lang=e.target.value;saveCfg();setRanges();applyLang();render()};
$('#theme').onchange=e=>{CFG.theme=e.target.value;document.documentElement.dataset.theme=CFG.theme;saveCfg();render()};
for(const [id,key] of [['fFrom','from'],['fTo','to'],['fProd','prod'],['fBrk','brk']])$('#'+id).onchange=e=>{S[key]=e.target.value;dirty();render()};
$('#fBasis').onchange=e=>{CFG.basis=e.target.value;saveCfg();dirty();render()};
$('#fX').onchange=e=>{CFG.xon=e.target.checked;saveCfg();dirty();render()};
window.addEventListener('resize',()=>{if(S.tab==='sum')render()});
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{if(!e.defaultPrevented&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();importFiles([...e.dataTransfer.files])}});
init();
</script>
