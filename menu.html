<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Control Center - Menu</title>
    <!-- CEK PROTEKSI LOGIN -->
    <script>
        if (localStorage.getItem('mcc_session') !== 'aktif') {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #777; margin-bottom: 30px; }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .menu-btn {
            flex: 1;
            min-width: 150px;
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            text-decoration: none;
            display: block;
        }
        .btn-m1 { background: #007bff; }
        .btn-m1:hover { background: #0056b3; transform: scale(1.05); }
        
        .btn-m2 { background: #28a745; }
        .btn-m2:hover { background: #218838; transform: scale(1.05); }

        .btn-m3 { background: #fd7e14; }
        .btn-m3:hover { background: #e8590c; transform: scale(1.05); }

        .logout-link {
            display: inline-block;
            margin-top: 30px;
            color: #dc3545;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h2>Market Control Center</h2>
    <p>Silakan pilih dashboard yang ingin Anda akses:</p>
    
    <div class="button-group">
        <a href="m1/index.html" class="menu-btn btn-m1">Akses Dashboard M1</a>
        <a href="m2/index.html" class="menu-btn btn-m2">Akses Dashboard M2</a>
        <a href="m3/index.html" class="menu-btn btn-m3">Akses Dashboard M3</a>
    </div>

    <a onclick="logout()" class="logout-link">← Keluar / Log Out</a>
</div>

<script>
    function logout() {
        localStorage.removeItem('mcc_session'); // Hapus kunci akses
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
