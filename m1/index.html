<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}</style></head><body>
<title>ACM Market Data</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: header actions, data-source slots, ACM-style market data report (green banner, product blocks), manual adjustments, analysis KPIs, charts, insight list. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#131a24; --ink2:#4c5766; --ink3:#7a8595; --line:#e1e6ed; --grid:#edf0f4;
  --hover:#eef2f8; --focus:#2a78d6; --ok:#0a7d52; --bad:#c0392b; --warn:#a15c00;
  --hdr:#3a8a2a; --hdrink:#ffffff; --band:#e9ecea; --sect:#f1f3f2; --tot:#d9dcda;
  --pc0:#2a78d6; --pc1:#eb6834; --pc2:#1baf7a; --pc3:#eda100; --pc4:#e87ba4; --pc5:#008300; --pc6:#6250d6; --pc7:#e34948;
  --up:#0a7d52; --down:#c0392b;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --ink:#eef1f5; --ink2:#b4bdca; --ink3:#8590a0; --line:#2a3340; --grid:#222b37;
  --hover:#1f2833; --focus:#6aa6f0; --ok:#3fc592; --bad:#ef7b6e; --warn:#f0b35a;
  --hdr:#2f7022; --hdrink:#f3fff0; --band:#1c2430; --sect:#1a212b; --tot:#26303d;
  --pc0:#3987e5; --pc1:#d95926; --pc2:#199e70; --pc3:#c98500; --pc4:#d55181; --pc5:#0ca30c; --pc6:#9085e9; --pc7:#e66767;
  --up:#3fc592; --down:#ef7b6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --ink:#eef1f5; --ink2:#b4bdca; --ink3:#8590a0; --line:#2a3340; --grid:#222b37;
  --hover:#1f2833; --focus:#6aa6f0; --ok:#3fc592; --bad:#ef7b6e; --warn:#f0b35a;
  --hdr:#2f7022; --hdrink:#f3fff0; --band:#1c2430; --sect:#1a212b; --tot:#26303d;
  --pc0:#3987e5; --pc1:#d95926; --pc2:#199e70; --pc3:#c98500; --pc4:#d55181; --pc5:#0ca30c; --pc6:#9085e9; --pc7:#e66767;
  --up:#3fc592; --down:#ef7b6e; color-scheme:dark}
/* Bloomberg skin */
:root[data-skin="bloomberg"]{
  --bg:#000000; --surface:#0a0a0a; --ink:#ffffff; --ink2:#fb8b1e; --ink3:#b0701f; --line:#3b2a0f; --grid:#1a1409;
  --hover:#1c1306; --focus:#4af6c3; --ok:#4af6c3; --bad:#ff433d; --warn:#ffd700;
  --hdr:#fb8b1e; --hdrink:#000000; --band:#120d04; --sect:#160f04; --tot:#2a1a05;
  --pc0:#3d8bff; --pc1:#fb8b1e; --pc2:#4af6c3; --pc3:#ffd700; --pc4:#c97cff; --pc5:#7ed321; --pc6:#00d1ff; --pc7:#ff433d;
  --up:#4af6c3; --down:#ff433d; color-scheme:dark;
  --font:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --head:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-skin="bloomberg"] :is(.card,.btn,.seg,.seg button,select,input,.status,.slot,.tip,.kpi,.tablewrap,.chip,details){border-radius:2px!important}
:root[data-skin="bloomberg"] h1,:root[data-skin="bloomberg"] .card h2{color:#fb8b1e;text-transform:uppercase;letter-spacing:.05em}
:root[data-skin="bloomberg"] .seg button[aria-pressed="true"],:root[data-skin="bloomberg"] .btn.primary{background:#fb8b1e;color:#000;border-color:#fb8b1e}
:root[data-skin="bloomberg"] .tip{background:#fb8b1e;color:#000}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
h1{font:600 24px/1.15 var(--head);margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);margin-top:4px}.foot{color:var(--ink3);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 13px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)} .btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.seg{display:inline-flex;gap:4px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.seg button{font:500 13px var(--font);color:var(--ink2);background:none;border:0;border-radius:6px;padding:6px 11px;cursor:pointer;min-height:32px}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select,input[type=number],input[type=text]{font:13px var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:34px;max-width:100%}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);display:flex;gap:10px;align-items:center;justify-content:space-between}
.status.ok{border-color:var(--ok);color:var(--ok)} .status.err{border-color:var(--bad);color:var(--bad)}
.status button{border:0;background:none;color:inherit;cursor:pointer;font-size:16px;line-height:1}
.drop{outline:2px dashed var(--focus);outline-offset:6px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.slot .k{font-size:12px;color:var(--ink3);margin-top:2px;overflow-wrap:anywhere}
.slot .s{font-weight:600;margin-top:4px;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.slot.on .dot{background:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font:600 15px/1.2 var(--head);margin:0 0 2px}
.card .hint{color:var(--ink3);font-size:12px;margin-bottom:12px}
.empty{text-align:center;padding:48px 16px}.empty .hint{max-width:620px;margin:8px auto 18px}
/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.banner{background:var(--hdr);color:var(--hdrink);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px;gap:12px}
.banner .brand{font:700 20px var(--head);letter-spacing:-.01em}
.banner .brand small{font:500 11px var(--font);opacity:.85;margin-left:6px}
.banner .ttl{font:600 20px var(--head)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.pblock{padding:6px 12px 2px}
.pname{font:600 19px var(--head);letter-spacing:.01em;text-transform:uppercase;margin:12px 4px 4px}
.ptot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sect);padding:4px 8px;font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase}
.ptot b{color:var(--ink);font-variant-numeric:tabular-nums;margin:0 6px}
.tablewrap{overflow-x:auto}
table.rt{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}
.rt th{background:var(--hdr);color:var(--hdrink);font-size:12px;font-weight:700;padding:5px 8px;text-align:right;white-space:nowrap}
.rt th:first-child,.rt td:first-child{text-align:left}
.rt td{padding:5px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rt tbody tr:nth-child(even) td{background:var(--band)}
.rt td.dash{color:var(--ink3)}
.up{color:var(--up)}.down{color:var(--down)}
.totals{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:12px;border-top:1px solid var(--line);margin-top:10px}
.tbox{display:flex;justify-content:space-between;gap:16px;background:var(--tot);padding:6px 12px;font-size:12px;font-weight:700;min-width:260px;flex:1 1 260px}
.tbox b{font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
summary{cursor:pointer;font-weight:600;font-size:13px}
.manual{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:12px;align-items:flex-end}
.manual .fgroup{align-items:flex-end}.manual label{display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--hover);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 10px}
.chip button{border:0;background:none;color:var(--ink2);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .v{font:600 24px/1.1 var(--head);margin-top:4px}.kpi .n{font-size:12px;color:var(--ink3);margin-top:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}.banner{grid-template-columns:1fr}.banner .ttl{display:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.gb{display:flex;flex-direction:column;gap:12px}
.gb .r{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center;font-size:12px}
.gb .bars{display:flex;flex-direction:column;gap:3px}
.gb .bar{display:flex;align-items:center;gap:6px}.gb .bar i{display:block;height:9px;border-radius:0 3px 3px 0;min-width:2px}
.curves{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.curves .c{border:1px solid var(--line);border-radius:8px;padding:8px}
svg text{fill:var(--ink3);font:10px var(--font)}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ins li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px;line-height:1.5}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);margin-top:2px;white-space:nowrap}
.tag.watch{color:var(--warn);border-color:var(--warn)}
.ins ul{margin:4px 0 0;padding-left:18px;color:var(--ink2);font-size:13px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:7px 10px;border-radius:6px;max-width:260px;display:none;line-height:1.4}
@media print{.actions,.slots,.status,details,.manualwrap{display:none!important}body{background:#fff!important;color:#000!important}.card,.report{break-inside:avoid}}
</style>

<div class="wrap" id="app">
  <header>
    <div style="min-width:0">
      <h1>ACM Market Data</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="actions">
      <div class="seg" id="fLang" role="group" aria-label="Language / Bahasa"><button data-l="id" aria-pressed="true">ID</button><button data-l="en" aria-pressed="false">EN</button></div>
      <div class="fgroup"><label class="lbl" for="selSkin" data-i="theme"></label><select id="selSkin"></select></div>
      <button class="btn primary" id="btnUpload" data-i="upload"></button>
      <button class="btn" id="btnSample" data-i="sample" hidden></button>
      <button class="btn" id="btnXlsx" data-i="exportXlsx" hidden></button>

      <input type="file" id="fileK" accept=".csv,.xls,.xlsx" hidden>

  <div class="status" id="status" hidden><span id="statusMsg"></span><button id="statusX" aria-label="Close">×</button></div>

  <section class="card empty" id="empty" hidden>

  <div id="main" style="display:flex;flex-direction:column;gap:16px" hidden>
    <div class="fgroup" style="gap:10px 28px"><div class="fgroup"><label class="lbl" for="selDate" data-i="tradeDate"></label><select id="selDate"></select></div><div class="fgroup"><label class="lbl" for="selPrev" data-i="prevSel"></label><select id="selPrev"></select></div></div>

        <label><span class="lbl" data-i="monthlyVol"></span><input type="number" id="inMonthly" step="1" min="0" style="width:140px"></label>

  </div>

</div>
<div class="tip" id="tip"></div>

<script>
/*LIB-START*/
const MD={};
MD.pad=n=>String(n).padStart(2,'0');
MD.norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
MD.parseCSV=function(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const first=text.slice(0,text.indexOf('\n')>0?text.indexOf('\n'):text.length);
  const D=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[];let row=[],f='',q=false,i=0;const n=text.length;
  while(i<n){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue}q=false;i++;continue}f+=c;i++;continue}
    if(c==='"'){q=true;i++;continue}
    if(c===D){row.push(f);f='';i++;continue}
    if(c==='\r'){i++;continue}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue}
    f+=c;i++}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
};
MD.toObjects=function(rows){
  if(!rows.length)return [];
  const h=rows[0].map(x=>String(x).trim()),out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i];if(r.length===1&&r[0]==='')continue;const o={};for(let j=0;j<h.length;j++)o[h[j]]=r[j]===undefined?'':r[j];out.push(o)}
  return out;
};
MD.detect=function(keys){
  const n=new Set(keys.map(MD.norm));
  if(n.has('contractticker')&&n.has('openquantity'))return 'positions';
  if(n.has('contractticker')&&n.has('tradeprice')&&n.has('quantity'))return 'trades';
  if(n.has('contractticker')&&n.has('businessdate')&&n.has('price'))return 'rates';
  return null;
};
MD.col=function(keys){const m={};keys.forEach(k=>m[MD.norm(k)]=k);return m};
MD.iso=function(v){
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return m[3]+'-'+MD.pad(m[2])+'-'+MD.pad(m[1]);
  return '';
};
MD.short=function(tk){const p=String(tk).trim().split('-');return p.length>=4?p.slice(2).join('-'):String(tk).trim()};
MD.prefix=function(tk){const p=String(tk).trim().split('-');return p.length>=4?p.slice(0,2).join('-')+'-':''};
MD.execTs=function(s){
  s=String(s).trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m)return {ts:Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0))/1000,hk:`${m[3]}-${MD.pad(m[2])}-${MD.pad(m[1])}T${MD.pad(m[4])}`};
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m)return {ts:Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))/1000,hk:`${m[1]}-${m[2]}-${m[3]}T${MD.pad(m[4])}`};
  return {ts:0,hk:''};
};
MD.ingestTrades=function(objs){
  const c=MD.col(Object.keys(objs[0]));
  const tk=c.contractticker,pr=c.tradeprice,q=c.quantity,dt=c.tradingdate||c.tradedate,bs=c.bs,ex=c.executiontime,tx=c.exchangetransactionid;
  const seen=new Set(),list=[];let prefix='';
  objs.forEach((o,i)=>{
    const con=MD.short(o[tk]);const price=parseFloat(o[pr]),qty=parseFloat(o[q]);
    if(!con||!isFinite(price)||!isFinite(qty))return;
    const side=bs?String(o[bs]).trim().toUpperCase()[0]:'';
    const txv=tx?String(o[tx]).trim():'';
    if(txv){const key=txv+'|'+con;if(seen.has(key))return;seen.add(key)}else if(bs&&side!=='B')return;
    const date=dt?MD.iso(o[dt]):'';if(!date)return;
    if(!prefix)prefix=MD.prefix(o[tk]);
    const e=ex?MD.execTs(o[ex]):{ts:0,hk:''};
    list.push({i,con,price,qty,date,ts:e.ts,hk:e.hk});
  });
  list.sort((a,b)=>a.ts-b.ts||a.i-b.i);
  const out={};
  for(const t of list){
    const d=out[t.date]||(out[t.date]={});let r=d[t.con];
    if(!r)r=d[t.con]={o:t.price,h:t.price,l:t.price,c:t.price,v:0,n:0,pv:0,hrs:{}};
    r.h=Math.max(r.h,t.price);r.l=Math.min(r.l,t.price);r.c=t.price;r.v+=t.qty;r.n++;r.pv+=t.price*t.qty;

  const byP={};

    let oi=null,oiManual=false;

    const row={con:c,exp:expOf(c),o:x?x.o:null,h:x?x.h:null,l:x?x.l:null,c:x?x.c:null,v:x?x.v:0,n:x?x.n:0,vwap:x&&x.v?x.pv/x.v:null,
      settle,prior:ps,chg:(settle!=null&&ps!=null)?Math.round((settle-ps)*1e8)/1e8:null,oi,oiManual,hrs:x?x.hrs:{}};
    (byP[p]||(byP[p]=[])).push(row);
  });
  const products=Object.keys(byP).sort().map(p=>{const rows=byP[p];return {code:p,name:PNAME[p]||p,rows,vol:rows.reduce((a,r)=>a+r.v,0),oi:rows.reduce((a,r)=>a+(r.oi||0),0),n:rows.reduce((a,r)=>a+r.n,0)}});
  const vol=products.reduce((a,p)=>a+p.vol,0),oi=products.reduce((a,p)=>a+p.oi,0),n=products.reduce((a,p)=>a+p.n,0);

    traded:products.reduce((a,p)=>a+p.rows.filter(r=>r.v>0).length,0),listed:products.reduce((a,p)=>a+p.rows.length,0)};
}

function insights(R){
  const out=[];const add=(lvl,key,params,items)=>out.push({lvl,key,params,items});
  const rows=R.products.flatMap(p=>p.rows);
  const traded=rows.filter(r=>r.v>0);
  if(traded.length){
    if(R.oi>0)add('info','i_summary',{v:fmt(R.vol),n:fmt(R.n),c:traded.length,oi:fmt(R.oi),turn:fmtD(R.vol/R.oi,2)});
    else add('info','i_summaryNoOi',{v:fmt(R.vol),n:fmt(R.n),c:traded.length});
    const lead=R.products.slice().sort((a,b)=>b.vol-a.vol)[0];
    if(lead&&lead.vol>0)add('info','i_lead',{p:lead.code,share:pct(lead.vol/R.vol),v:fmt(lead.vol),oishare:R.oi?pct(lead.oi/R.oi):'-'});
    const top=traded.slice().sort((a,b)=>b.v-a.v).slice(0,3);
    add('info','i_top3',{list:top.map(r=>`${r.con} (${fmt(r.v)})`).join(', '),share:pct(top.reduce((a,r)=>a+r.v,0)/R.vol)});
    R.products.filter(p=>p.vol>=20).forEach(p=>{
      const f=p.rows.filter(r=>r.v>0).sort((a,b)=>b.v-a.v)[0];
      if(f&&f.v/p.vol>=0.55&&p.rows.filter(r=>r.v>0).length>1&&out.filter(o=>o.key==='i_front').length<3)add('info','i_front',{p:p.code,c:f.con,share:pct(f.v/p.vol)});
    });
    const tp=R.products.filter(p=>p.oi>0&&p.vol>0).map(p=>({p:p.code,x:p.vol/p.oi})).sort((a,b)=>b.x-a.x);
    if(tp.length>=2)add('info','i_turn',{p1:tp[0].p,x1:fmtD(tp[0].x,2),p2:tp[tp.length-1].p,x2:fmtD(tp[tp.length-1].x,2)});
  }
  const mv=rows.filter(r=>r.chg!=null&&r.prior).map(r=>({r,pc:r.chg/r.prior})).sort((a,b)=>Math.abs(b.pc)-Math.abs(a.pc)).slice(0,4);
  if(mv.length)add(Math.abs(mv[0].pc)>=0.02?'watch':'info','i_move',{},mv.map(x=>`${x.r.con}: ${spct(x.pc)} (${x.r.chg>0?'+':'−'}${fmtD(Math.abs(x.r.chg),decOf(prodOf(x.r.con)))})`));
  const rg=traded.filter(r=>r.v>=10&&r.l>0).map(r=>({r,rg:(r.h-r.l)/r.l})).sort((a,b)=>b.rg-a.rg)[0];
  if(rg){const r=rg.r,d=decOf(prodOf(r.con));add('info','i_range',{c:r.con,range:pct(rg.rg),l:fmtD(r.l,d),h:fmtD(r.h,d),o:fmtD(r.o,d),la:fmtD(r.c,d),mv:spct((r.c-r.o)/r.o)})}
  const gap=traded.filter(r=>r.v>=10&&r.settle!=null&&Math.abs(r.c-r.settle)/r.settle>0.0025).sort((a,b)=>Math.abs(b.c-b.settle)/b.settle-Math.abs(a.c-a.settle)/a.settle).slice(0,4);
  if(gap.length)add('watch','i_gap',{th:pct(0.0025,2)},gap.map(r=>{const d=decOf(prodOf(r.con));return `${r.con}: Last ${fmtD(r.c,d)} vs Settle ${fmtD(r.settle,decOf(prodOf(r.con),true))} (${spct((r.settle-r.c)/r.c)})`}));
  const curve=R.products.map(p=>{
    const pts=p.rows.filter(r=>r.settle!=null);if(pts.length<2)return null;
    const a=pts[0],b=pts[pts.length-1];let up=0,dn=0;for(let i=1;i<pts.length;i++){if(pts[i].settle>pts[i-1].settle)up++;else if(pts[i].settle<pts[i-1].settle)dn++}
    const shape=up&&!dn?'contango':dn&&!up?'backw':(!up&&!dn)?'flat':'mixed';
    return t('curveItem',{p:p.code,shape:t(shape),a:fmtD(a.settle,decOf(p.code,true)),b:fmtD(b.settle,decOf(p.code,true)),pct:spct((b.settle-a.settle)/a.settle),c1:a.exp,c2:b.exp});
  }).filter(Boolean);
  if(curve.length)add('info','i_curve',{},curve);
  const idle=rows.filter(r=>r.oi>0&&r.v===0).map(r=>r.con);
  if(idle.length)add('info','i_idle',{list:idle.join(', ')});
  const noOi=DATA.oi?traded.filter(r=>!r.oi).map(r=>r.con):[];
  if(noOi.length)add('watch','i_noOi',{list:noOi.join(', ')});
  const nos=traded.filter(r=>r.settle==null).map(r=>r.con);
  if(nos.length)add('watch','i_noSettle',{list:nos.join(', ')});
  const noc=rows.filter(r=>r.settle!=null&&r.prior==null).length;
  if(noc)add('info','i_noChange',{n:noc});
  if(!DATA.oi)add('watch','i_oiMissing',{});
  else if(DATA.oi.asOf&&DATA.oi.asOf!==R.date)add('watch','i_oiAsOf',{asOf:DATA.oi.asOf,date:R.date});
  const mo=rows.filter(r=>r.oiManual).map(r=>r.con);
  if(mo.length)add('info','i_manualOi',{list:mo.join(', ')});
  const hk=Object.keys(R.hours).map(k=>({k,v:Object.values(R.hours[k]).reduce((a,b)=>a+b,0)})).sort((a,b)=>b.v-a.v)[0];
  if(hk&&R.vol)add('info','i_peak',{h:hrLabel(hk.k),v:fmt(hk.v),share:pct(hk.v/R.vol)});
  if(R.monthly&&R.vol)add('info','i_monthly',{share:pct(R.vol/R.monthly),m:fmt(R.monthly)});

}

  $('kpis').innerHTML=items.map(i=>`<div class="kpi"><div class="lbl">${i[0]}</div><div class="v num">${i[1]}</div><div class="n">${i[2]}</div></div>`).join('');

function renderVolOi(){
  const mx=Math.max(1,...R.products.map(p=>Math.max(p.vol,p.oi)));
  $('lgVO').innerHTML=`<span><i style="background:var(--pc0)"></i>${t('lgVol')}</span><span><i style="background:var(--pc1)"></i>${t('lgOi')}</span>`;

function renderHours(){
  const keys=Object.keys(R.hours).sort(),prods=R.products.map(p=>p.code);
  if(!keys.length){$('chH').innerHTML=`<div class="foot">${t('noData')}</div>`;$('lgH').innerHTML='';return}
  const tot=k=>Object.values(R.hours[k]).reduce((a,b)=>a+b,0);
  const mx=Math.max(...keys.map(tot));
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p};
  const top=nice(mx),W=560,H=210,Lm=38,B=24,T=8,Rm=4,iw=W-Lm-Rm,ih=H-B-T,bw=iw/keys.length,step=Math.max(1,Math.ceil(keys.length/12));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t('hoursTitle')}">`;
  for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;s+=`<line x1="${Lm}" x2="${W-Rm}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${Lm-5}" y="${y+3}" text-anchor="end">${fmt(top*i/4)}</text>`}
  keys.forEach((k,i)=>{
    const x=Lm+i*bw;let y=T+ih;
    prods.forEach((p,pi)=>{const v=R.hours[k][p]||0;if(!v)return;const hh=v/top*ih;y-=hh;s+=`<rect x="${x+bw*.14}" y="${y}" width="${bw*.72}" height="${Math.max(0,hh-1.2)}" fill="var(--pc${pi%8})" rx="${hh>4?2:0}"/>`});
    s+=`<rect class="hit" data-k="${k}" x="${x}" y="${T}" width="${bw}" height="${ih}" fill="transparent"/>`;
    if(i%step===0)s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${k.slice(-2)}</text>`;
  });
  $('chH').innerHTML=s+'</svg>';
  $('lgH').innerHTML=prods.map((p,i)=>`<span><i style="background:var(--pc${i%8})"></i>${p}</span>`).join('');
  $('chH').querySelectorAll('.hit').forEach(el=>{const k=el.dataset.k;el.onmousemove=e=>showTip(e,`<b>${hrLabel(k)}</b><br>${fmt(tot(k))} ${t('kLot')}`+prods.map(p=>R.hours[k][p]?`<br>${p}: ${fmt(R.hours[k][p])}`:'').join(''));el.onmouseleave=hideTip});
}
function renderCurves(){
  const els=[];
  R.products.forEach((p,pi)=>{
    const pts=p.rows.filter(r=>r.settle!=null);if(pts.length<2)return;
    const ds=decOf(p.code,true),vals=pts.map(r=>r.settle),mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn)*0.25||Math.abs(mx)*0.002;
    const W=180,H=96,Lm=6,Rm=6,T=14,B=22,iw=W-Lm-Rm,ih=H-T-B,lo=mn-pad,hi=mx+pad;
    const X=i=>Lm+(pts.length===1?iw/2:iw*i/(pts.length-1)),Y=v=>T+ih-(v-lo)/(hi-lo)*ih;
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${p.code}"><polyline fill="none" stroke="var(--pc${pi%8})" stroke-width="2" points="${pts.map((r,i)=>X(i)+','+Y(r.settle)).join(' ')}"/>`;
    pts.forEach((r,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(r.settle)}" r="3.2" fill="var(--pc${pi%8})" stroke="var(--surface)" stroke-width="1.5"><title>${r.con}: ${fmtD(r.settle,ds)}</title></circle><text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${r.exp.slice(-4)}</text>`});
    s+=`<text x="${Lm}" y="10" style="font-weight:600;fill:var(--ink)">${p.code}</text><text x="${W-Rm}" y="10" text-anchor="end">${fmtD(vals[0],ds)} → ${fmtD(vals[vals.length-1],ds)}</text></svg>`;
    els.push(`<div class="c">${s}</div>`);
  });
  $('chC').innerHTML=els.join('')||`<div class="foot">${t('noData')}</div>`;
}
function renderInsights(){

function render(){

  $('main').hidden=!has;$('empty').hidden=has;

/* ---------- upload ---------- */
function setStatus(msg,kind){const s=$('status');s.hidden=!msg;s.className='status'+(kind?' '+kind:'');$('statusMsg').textContent=msg||''}
async function readObjs(file){
  if(/\.csv$/i.test(file.name)||file.type==='text/csv')return MD.toObjects(MD.parseCSV(await file.text()));
  if(!window.XLSX)throw new Error('xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  for(const n of wb.SheetNames){const o=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''});if(o.length&&MD.detect(Object.keys(o[0])))return o}
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
}
let pendingKind=null;
async function handleFiles(files,opts){
  opts=opts||{};files=[...files];if(!files.length)return;
  const want=opts.kind==='prev'?'rates':(opts.kind||null);
  const kn={trades:'kindTrades',positions:'kindPos',rates:'kindRates'};
  const msgs=[];let bad=false,lastRates=null,lastTrades=null;
  for(const f of files){
    setStatus(t('parsing',{f:f.name}));
    await new Promise(r=>setTimeout(r,20));
    try{
      const objs=await readObjs(f);
      const got=objs.length?MD.detect(Object.keys(objs[0])):null;
      if(!got){msgs.push(t('unknownFile',{f:f.name}));bad=true;continue}
      if(want&&got!==want){msgs.push(t('wrongKind',{f:f.name,got:t(kn[got]),want:t(kn[want])}));bad=true;continue}
      const r=MD.fromObjs(DATA,objs,f.name);
      if(r.error){msgs.push(t('unknownFile',{f:f.name}));bad=true;continue}
      if(r.kind==='rates')lastRates=Object.keys(r.res.dates);
      if(r.kind==='trades')lastTrades=Object.keys(r.res.dates);
      msgs.push(t('loadedFile',{f:f.name,k:t(kn[r.kind]),n:fmt(objs.length)}));
    }catch(e){msgs.push(t('readFail',{f:f.name}));bad=true}
  }
  curDate=opts.kind?curDate:'';
  if(opts.kind==='trades'&&lastTrades)curDate=lastTrades.slice().sort().pop();
  else if(opts.kind==='rates'&&lastRates)curDate=lastRates.slice().sort().pop();
  render();
  if(opts.kind==='prev'&&lastRates&&curDate){
    const e=lastRates.filter(d=>d<curDate).sort();
    if(e.length){man(curDate).prevDate=e[e.length-1];render()}else{msgs.push(t('prevLater',{d:curDate}));bad=true}
  }
  setStatus(msgs.join(' '),bad?'err':'ok');
}

/* ---------- export ---------- */
let DL=null;
const stamp=()=>curDate.replace(/-/g,'');
function productSummary(){return R.products.map(p=>({code:p.code,vol:p.vol,oi:p.oi,n:p.n,share:R.vol?p.vol/R.vol:0,oiShare:R.oi?p.oi/R.oi:0,turn:p.oi?p.vol/p.oi:null}))}
function reportAoa(){
  const a=[['ACM Exchange - '+t('marketData')],[t('tradeDateLbl'),dateLong(R.date)],['USDIDR',R.usdidr!=null?R.usdidr:''],[t('chgBasis',{a:R.date,b:R.prevDate||'-'})],[]];
  R.products.forEach(p=>{
    a.push([pName(p.code)]);a.push([t('estVolTotals'),p.vol,'',t('oiTotals'),p.oi]);
    a.push([t('month'),t('open'),t('high'),t('low'),t('last'),t('change'),t('settle'),t('estVol'),t('priorOi')]);
    p.rows.forEach(r=>a.push([DATA.prefix+r.con,r.o??'',r.h??'',r.l??'',r.c??'',r.chg??'',r.settle??'',r.v,r.oi??'']));
    a.push([]);
  });
  a.push([t('dailyVol'),R.vol],[t('dailyOi'),R.oi],[t('monthlyVol'),R.monthly??'']);
  return a;
}
function insightLines(){
  const lines=[];
  insights(R).forEach(i=>{lines.push((i.lvl==='watch'?'['+t('watch')+'] ':'')+insText(i));(i.items||[]).forEach(x=>lines.push('   - '+x))});
  return lines;
}
function exportXlsx(){
  const wb=XLSX.utils.book_new();
  const sh=(aoa,name,w)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);if(w)ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))};
  sh(reportAoa(),t('marketData'),[24,11,11,11,11,11,11,13,13]);
  sh([[t('product'),t('kVol'),t('share'),t('kOi'),t('oiShare'),t('turn'),t('trades')],...productSummary().map(p=>[p.code,p.vol,Math.round(p.share*10000)/10000,p.oi,Math.round(p.oiShare*10000)/10000,p.turn==null?'':Math.round(p.turn*100)/100,p.n])],t('summary'),[10,12,10,10,10,10,10]);
  const keys=Object.keys(R.hours).sort(),prods=R.products.map(p=>p.code);
  sh([[t('kPeak'),...prods,'Total'],...keys.map(k=>[hrLabel(k),...prods.map(p=>R.hours[k][p]||0),Object.values(R.hours[k]).reduce((a,b)=>a+b,0)])],t('hoursSheet'),[16,...prods.map(()=>9),9]);
  sh([[t('analysisTitle')+' - '+R.date],...insightLines().map(x=>[x])],t('analysisSheet'),[160]);
  return {filename:`market-data_${stamp()}.xlsx`,data:XLSX.write(wb,{type:'array',bookType:'xlsx'})};
}
function exportPdf(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});
  const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight(),M=30;
  const GREEN=[58,138,42],hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  let y=M;
  const ensure=h=>{if(y+h>PH-M){doc.addPage();y=M}};
  doc.setFillColor(...GREEN);doc.rect(M,y,PW-2*M,26,'F');
  doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('ACM Exchange',M+8,y+17);doc.text(t('marketData'),PW/2,y+17,{align:'center'});y+=36;
  doc.setTextColor(20);doc.setFontSize(8);doc.text(`${t('tradeDateLbl')} : ${dateLong(R.date)}`,M,y);doc.text(`USDIDR : ${R.usdidr!=null?fmt(R.usdidr):'-'}`,PW-M,y,{align:'right'});y+=10;doc.setTextColor(90);doc.text(t('chgBasis',{a:R.date,b:R.prevDate||'-'}),M,y);doc.setTextColor(20);y+=10;
  R.products.forEach(p=>{
    const dp=decOf(p.code),ds=decOf(p.code,true);
    ensure(70);
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(20);doc.text(pName(p.code),M,y+10);y+=16;
    doc.setFontSize(7.5);doc.setTextColor(90);doc.text(`${t('estVolTotals').toUpperCase()}  ${fmt(p.vol)}`,M,y+6);doc.text(`${t('oiTotals').toUpperCase()}  ${fmt(p.oi)}`,PW-M,y+6,{align:'right'});y+=9;
    doc.autoTable({startY:y,margin:{left:M,right:M},theme:'plain',
      head:[[t('month'),t('open'),t('high'),t('low'),t('last'),t('change'),t('settle'),t('estVol'),t('priorOi')]],
      body:p.rows.map(r=>[DATA.prefix+r.con,r.o==null?'-':fmtD(r.o,dp),r.h==null?'-':fmtD(r.h,dp),r.l==null?'-':fmtD(r.l,dp),r.c==null?'-':fmtD(r.c,dp),r.chg==null?'-':(r.chg>0?'+':'')+fmtD(r.chg,dp),r.settle==null?'-':fmtD(r.settle,ds),fmt(r.v),r.oi==null?'-':fmt(r.oi)+(r.oiManual?'*':'')]),
      styles:{font:'helvetica',fontSize:7.5,cellPadding:2.5,halign:'right'},headStyles:{fillColor:GREEN,textColor:255,fontStyle:'bold'},
      columnStyles:{0:{halign:'left',cellWidth:96}},alternateRowStyles:{fillColor:[233,236,234]}});
    y=doc.lastAutoTable.finalY+10;
  });
  ensure(60);
  doc.autoTable({startY:y,margin:{left:M,right:M},theme:'plain',body:[[`${t('dailyVol')} : ${fmt(R.vol)}`,`${t('dailyOi')} : ${fmt(R.oi)}`,`${t('monthlyVol')} : ${R.monthly!=null?fmt(R.monthly):'-'}`]],styles:{font:'helvetica',fontSize:8,fontStyle:'bold',fillColor:[217,220,218],cellPadding:5}});
  y=doc.lastAutoTable.finalY+16;
  /* analysis */
  doc.addPage();y=M;
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(20);doc.text(t('analysisTitle')+' · '+R.date,M,y+12);y+=26;
  doc.setFontSize(9);doc.text(t('volOiTitle'),M,y);y+=8;
  const mx=Math.max(1,...R.products.map(p=>Math.max(p.vol,p.oi))),bw=PW-2*M-120;
  R.products.forEach(p=>{
    ensure(26);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(40);doc.text(p.code,M,y+9);

    doc.setFillColor(...hex(PHEX[1]));doc.rect(M+40,y+11,Math.max(1,p.oi/mx*bw),6,'F');doc.text(fmt(p.oi),M+44+p.oi/mx*bw,y+17);y+=24;
  });
  doc.setFontSize(7);doc.setFillColor(...hex(PHEX[0]));doc.rect(M,y,8,8,'F');doc.setTextColor(60);doc.text(t('lgVol'),M+11,y+7);doc.setFillColor(...hex(PHEX[1]));doc.rect(M+70,y,8,8,'F');doc.text(t('lgOi'),M+81,y+7);y+=22;
  doc.setFontSize(9);doc.setTextColor(20);

    ensure(lines.length*12+4);doc.setFont('helvetica',sub?'normal':'normal');doc.text(lines,M+(sub?18:0),y+8);y+=lines.length*12+(sub?1:5);
  });
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(122,133,149);doc.text(`ACM Market Data · ${i}/${n}`,PW-M,PH-14,{align:'right'})}
  return {filename:`market-data_${stamp()}.pdf`,data:doc.output('arraybuffer')};
}
async function doExport(kind,btn){
  btn.disabled=true;setStatus(t('exporting'));
  try{
    await new Promise(r=>setTimeout(r,30));
    const f=kind==='xlsx'?exportXlsx():exportPdf();
    if(DL)await DL.save(f);
    else{const url=URL.createObjectURL(new Blob([f.data]));const a=document.createElement('a');a.href=url;a.download=f.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
    setStatus(t('saved',{f:f.filename}),'ok');
  }catch(e){setStatus(t('exportFail'),'err')}
  finally{btn.disabled=false}
}

let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault();dragN++;$('app').classList.add('drop')});
addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)$('app').classList.remove('drop')});
addEventListener('dragover',e=>e.preventDefault());

applyStatic();render();
if(!window.XLSX&&!true)$('btnUpload').disabled=true;
(async()=>{try{DL=await window.claude?.use?.('downloads')}catch(e){DL=null}
  if(!DL)$('btnPrint').hidden=false;render()})();
</script>
