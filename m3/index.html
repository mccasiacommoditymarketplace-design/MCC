<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>MCC Market Control Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f9;--surface:#fff;--ink:#0f1b2d;--ink2:#4a5a72;--mute:#8492a6;--line:#dfe5ee;--grid:#e8edf4;--accent:#0b6bcb;--up:#0a8f5b;--dn:#d6372f;--sel:#e9f1fb;--font:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--r:10px}
:root[data-theme=dark]{--bg:#0d1420;--surface:#151e2d;--ink:#e6ecf5;--ink2:#a9b6ca;--mute:#6f7f96;--line:#26334a;--grid:#1e2a3d;--accent:#4aa3ff;--up:#2fc98a;--dn:#ff6b61;--sel:#1b2a44}
:root[data-theme=bloomberg]{--bg:#000;--surface:#0b0b0b;--ink:#ffb000;--ink2:#e29a00;--mute:#8a6a1a;--line:#3a2a00;--grid:#1a1300;--accent:#ffb000;--up:#00e676;--dn:#ff3b30;--sel:#2a1d00;--font:var(--mono);--r:0}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;letter-spacing:.02em}h1 small{display:block;font-size:12px;font-weight:400;color:var(--mute);letter-spacing:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
select,.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) - 3px);padding:6px 10px;cursor:pointer}
.btn:hover,select:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme=bloomberg] .btn.pri{color:#000}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:calc(var(--r) - 3px);overflow:hidden}
.seg button{font:inherit;background:var(--surface);color:var(--ink2);border:0;border-right:1px solid var(--line);padding:6px 10px;cursor:pointer}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent);color:#fff}
:root[data-theme=bloomberg] .seg button.on{color:#000}
.lbl{font-size:12px;color:var(--mute);margin-right:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi .k{font-size:12px;color:var(--mute)}.kpi .v{font-size:19px;font-weight:600;font-family:var(--mono)}
.up{color:var(--up)}.dn{color:var(--dn)}
.chartbox{position:relative;height:520px}canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.tip{position:absolute;pointer-events:none;display:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:12px/1.5 var(--mono);box-shadow:0 4px 16px #0003;z-index:3;white-space:nowrap}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.chartbox{height:400px}}
.tw{overflow:auto;max-height:340px}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--surface);color:var(--mute);font-weight:500;font-size:12px}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover,tr.sel{background:var(--sel)}td{font-family:var(--mono)}
h2{font-size:14px;margin:0 0 8px}
.status{margin-bottom:12px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.status.err{border-color:var(--dn);color:var(--dn)}.status.ok{border-color:var(--up);color:var(--up)}.status button{background:none;border:0;color:inherit;cursor:pointer;font-size:16px}
.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.empty{text-align:center;padding:60px 16px;color:var(--ink2)}
@media print{.tools,.status,.hint{display:none!important}body{background:#fff}}
</style>

 const b=BARS,d=decs(INS),fx=v=>v.toFixed(d);
 if(!b.length){$('kpis').innerHTML='';return}
 const o=b[0].o,c=b[b.length-1].c,h=Math.max(...b.map(x=>x.h)),l=Math.min(...b.map(x=>x.l)),vol=b.reduce((s,x)=>s+x.v,0),n=b.reduce((s,x)=>s+x.n,0),ch=c-o,cls=ch>0?'up':ch<0?'dn':'';
 const k=(a,v,c)=>`<div class="card kpi"><div class="k">${a}</div><div class="v ${c||''}">${v}</div></div>`;
 $('kpis').innerHTML=k(t('kOpen'),fx(o))+k(t('kHigh'),fx(h))+k(t('kLow'),fx(l))+k(t('kLast'),fx(c),cls)+
  k(t('kChg'),(ch>0?'+':'')+fx(ch)+' ('+(o?(ch/o*100).toFixed(2):'0.00')+'%)',cls)+k(t('kVol'),fmt(vol))+k(t('kTr'),fmt(n))+k(t('kBars'),fmt(b.length));
}
function renderTables(){
 const keys=Object.keys(BY).sort((a,b)=>sum(BY[b])-sum(BY[a]));
 let h=`<thead><tr><th>${t('ins')}</th><th>${t('last')}</th><th>${t('chg')}</th><th>${t('chgp')}</th><th>${t('hi')}</th><th>${t('lo')}</th><th>${t('vol')}</th><th>${t('trades')}</th></tr></thead><tbody>`;
 for(const k of keys){const a=BY[k],d=decs(k),o=a[0][2],c=a[a.length-1][2],ch=c-o,cl=ch>0?'up':ch<0?'dn':'';
  h+=`<tr class="clk ${k===INS?'sel':''}" data-k="${k}"><td>${k}</td><td>${c.toFixed(d)}</td><td class="${cl}">${(ch>0?'+':'')+ch.toFixed(d)}</td><td class="${cl}">${o?(ch/o*100).toFixed(2):'0.00'}%</td><td>${Math.max(...a.map(x=>x[2])).toFixed(d)}</td><td>${Math.min(...a.map(x=>x[2])).toFixed(d)}</td><td>${fmt(sum(a))}</td><td>${fmt(a.length)}</td></tr>`}
 $('tOv').innerHTML=h+'</tbody>';
 $('tOv').querySelectorAll('tr.clk').forEach(r=>r.onclick=()=>{INS=r.dataset.k;$('selIns').value=INS;rebuild()});
 const d=decs(INS);$('hOhlc').textContent=t('ohlcv',{c:INS,tf:tfName(TF)});
 let b=`<thead><tr><th>${t('time')}</th><th>${t('o')}</th><th>${t('h')}</th><th>${t('l')}</th><th>${t('c')}</th><th>${t('vol')}</th><th>${t('trades')}</th></tr></thead><tbody>`;
 for(const x of BARS.slice().reverse().slice(0,300))b+=`<tr><td>${tfmt(x.t,true)}</td><td>${x.o.toFixed(d)}</td><td>${x.h.toFixed(d)}</td><td>${x.l.toFixed(d)}</td><td class="${x.c>=x.o?'up':'dn'}">${x.c.toFixed(d)}</td><td>${fmt(x.v)}</td><td>${x.n}</td></tr>`;
 $('tBars').innerHTML=b+'</tbody>';
 $('note').textContent=t('note');
}
/* ---------- chart ---------- */
const cv=$('cv');let G=null;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceTicks(lo,hi,n){const span=hi-lo,raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,s=(m<1.5?1:m<3?2:m<7?5:10)*p,out=[];for(let v=Math.ceil(lo/s)*s;v<=hi+1e-9;v+=s)out.push(+v.toFixed(8));return out}
function draw(){
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
 cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
 const C={bg:css('--surface'),ink:css('--ink'),mute:css('--mute'),grid:css('--grid'),up:css('--up'),dn:css('--dn'),acc:css('--accent'),line:css('--line')};
 x.fillStyle=C.bg;x.fillRect(0,0,W,H);
 const mono=css('--mono')||'monospace';x.font='11px '+mono;
 const b=BARS;if(!b.length){x.fillStyle=C.mute;x.fillText(t('nodata'),20,30);G=null;return}
 const n=Math.max(1,Math.min(Math.max(5,V.n),b.length)),end=Math.max(n,Math.min(V.end,b.length)),st=end-n;V.n=n;V.end=end;
 const pl=8,pr=64,pt=10,pb=22,pw=W-pl-pr,ph=H-pt-pb,vh=Math.round(ph*.2),gap=10,ch=ph-vh-gap,bw=pw/Math.max(n,20);
 const vis=b.slice(st,end);let hi=-Infinity,lo=Infinity,vm=0;
 for(const k of vis){hi=Math.max(hi,k.h);lo=Math.min(lo,k.l);vm=Math.max(vm,k.v)}
 if(hi===lo){hi+=Math.abs(hi)*.01||1;lo-=Math.abs(lo)*.01||1}
 const mg=(hi-lo)*.06;hi+=mg;lo-=mg;
 const d=decs(INS),X=i=>pl+(i-st+.5)*bw,Y=p=>pt+(hi-p)/(hi-lo)*ch,VY=v=>pt+ch+gap+vh-(vm?v/vm*vh:0);
 x.textBaseline='middle';x.lineWidth=1;
 for(const tk of niceTicks(lo,hi,6)){const y=Math.round(Y(tk))+.5;x.strokeStyle=C.grid;x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();x.fillStyle=C.mute;x.textAlign='left';x.fillText(tk.toFixed(d),W-pr+6,y)}
 x.textAlign='center';x.textBaseline='top';const step=Math.max(1,Math.ceil(90/bw));let lastDay=-1;
 for(let i=st;i<end;i+=step){const dy=Math.floor(b[i].t/86400),full=dy!==lastDay&&TF<86400;lastDay=dy;x.fillStyle=C.mute;if(X(i)>=pl+26)x.fillText(tfmt(b[i].t,full),X(i),H-pb+5);
  x.strokeStyle=C.grid;x.beginPath();x.moveTo(Math.round(X(i))+.5,pt);x.lineTo(Math.round(X(i))+.5,pt+ch);x.stroke()}
 const bodyW=Math.max(1,Math.min(bw*.7,28));
 if(TYPE==='line'||TYPE==='area'){
  x.beginPath();vis.forEach((k,j)=>{const px=X(st+j),py=Y(k.c);j?x.lineTo(px,py):x.moveTo(px,py)});
  if(TYPE==='area'){x.save();x.lineTo(X(end-1),pt+ch);x.lineTo(X(st),pt+ch);x.closePath();const g=x.createLinearGradient(0,pt,0,pt+ch);g.addColorStop(0,C.acc+'55');g.addColorStop(1,C.acc+'05');x.fillStyle=g;x.fill();x.restore();
   x.beginPath();vis.forEach((k,j)=>{const px=X(st+j),py=Y(k.c);j?x.lineTo(px,py):x.moveTo(px,py)})}
  x.strokeStyle=C.acc;x.lineWidth=2;x.stroke();x.lineWidth=1;
 }else for(let j=0;j<vis.length;j++){const k=vis[j],px=X(st+j),up=k.c>=k.o,col=up?C.up:C.dn;x.strokeStyle=col;x.fillStyle=col;
  x.beginPath();x.moveTo(Math.round(px)+.5,Y(k.h));x.lineTo(Math.round(px)+.5,Y(k.l));x.stroke();
  if(TYPE==='candle'){const y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));x.fillRect(px-bodyW/2,y1,bodyW,Math.max(1,y2-y1))}
  else{const tw=Math.max(2,bodyW/2);x.beginPath();x.moveTo(px-tw,Y(k.o));x.lineTo(px,Y(k.o));x.moveTo(px,Y(k.c));x.lineTo(px+tw,Y(k.c));x.stroke()}}
 for(let j=0;j<vis.length;j++){const k=vis[j],px=X(st+j);x.fillStyle=(k.c>=k.o?C.up:C.dn)+'99';const y=VY(k.v);x.fillRect(px-bodyW/2,y,bodyW,pt+ch+gap+vh-y)}
 x.fillStyle=C.mute;x.textAlign='left';x.textBaseline='top';x.fillText('Vol '+fmt(vm),pl+4,pt+ch+gap+1);
 const last=b[b.length-1].c;if(Y(last)>=pt&&Y(last)<=pt+ch){const y=Math.round(Y(last))+.5;x.setLineDash([4,3]);x.strokeStyle=C.acc;x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();x.setLineDash([]);
  x.fillStyle=C.acc;x.fillRect(W-pr,y-9,pr-2,18);x.fillStyle=css('--surface');x.textAlign='left';x.textBaseline='middle';x.fillText(last.toFixed(d),W-pr+5,y)}
 if(HOVER>=st&&HOVER<end){const k=b[HOVER],px=Math.round(X(HOVER))+.5;x.strokeStyle=C.mute;x.setLineDash([3,3]);x.beginPath();x.moveTo(px,pt);x.lineTo(px,pt+ch+gap+vh);x.stroke();
  const py=Math.round(Y(k.c))+.5;x.beginPath();x.moveTo(pl,py);x.lineTo(W-pr,py);x.stroke();x.setLineDash([])}
 G={st,end,bw,pl,pr,pt,ch,W,H,d};
}
function onMove(e){
 if(!G)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 if(drag){const di=Math.round((drag.x-mx)/G.bw);if(di){V.end=Math.max(V.n,Math.min(BARS.length,drag.end+di))}draw();return}
 const i=G.st+Math.floor((mx-G.pl)/G.bw);
 if(i<G.st||i>=G.end||mx>G.W-G.pr){HOVER=-1;$('tip').style.display='none';draw();return}
 HOVER=i;draw();const k=BARS[i],d=G.d,ch=k.c-k.o,tp=$('tip');
 tp.innerHTML=`<b>${tfmt(k.t,true)}</b><br>O ${k.o.toFixed(d)}  H ${k.h.toFixed(d)}<br>L ${k.l.toFixed(d)}  C <span class="${ch>=0?'up':'dn'}">${k.c.toFixed(d)}</span><br>${t('vol')} ${fmt(k.v)} · ${k.n} ${t('trades').toLowerCase()}`;
 tp.style.display='block';const bx=$('cbox').getBoundingClientRect();let lx=mx+14;if(lx+tp.offsetWidth>bx.width)lx=mx-tp.offsetWidth-14;tp.style.left=lx+'px';tp.style.top=Math.max(4,Math.min(my+10,bx.height-tp.offsetHeight-4))+'px';
}
let drag=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();drag={x:e.clientX-r.left,end:V.end};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointermove',onMove);
cv.addEventListener('pointerleave',()=>{HOVER=-1;$('tip').style.display='none';draw()});
cv.addEventListener('wheel',e=>{e.preventDefault();if(!G)return;const f=e.deltaY>0?1.15:1/1.15;V.n=Math.max(5,Math.min(BARS.length,Math.round(V.n*f)));draw()},{passive:false});
cv.addEventListener('dblclick',()=>{V.n=Math.min(120,BARS.length);V.end=BARS.length;draw()});
new ResizeObserver(()=>draw()).observe($('cbox'));
/* ---------- UI ---------- */
function applyLang(){
 document.documentElement.lang=LANG;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('segLang').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===LANG));
 $('segType').innerHTML=TYPES.map(k=>`<button data-v="${k}" class="${k===TYPE?'on':''}">${t(k)}</button>`).join('');
 $('segType').querySelectorAll('button').forEach(b=>b.onclick=()=>{TYPE=b.dataset.v;applyLang();draw()});
 $('segTf').innerHTML=TFS.map(x=>`<button data-v="${x[0]}" class="${x[0]===TF?'on':''}">${x[1]}</button>`).join('');
 $('segTf').querySelectorAll('button').forEach(b=>b.onclick=()=>{TF=+b.dataset.v;applyLang();rebuild()});
 if(FILLS.length){renderKpis();renderTables()}draw();
}
function applyTheme(){document.documentElement.dataset.theme=THEME;$('selTheme').value=THEME;try{localStorage.setItem('mcc-theme',THEME)}catch(e){}draw()}
$('selTheme').onchange=e=>{THEME=e.target.value;applyTheme()};
$('segLang').querySelectorAll('button').forEach(b=>b.onclick=()=>{LANG=b.dataset.v;applyLang()});
$('selIns').onchange=e=>{INS=e.target.value;rebuild()};
$('statusX').onclick=()=>setStatus('');
$('btnUp').onclick=()=>$('file').click();
$('file').onchange=e=>{handleFile(e.target.files[0]);e.target.value=''};
$('btnSample').onclick=()=>{setFills(SAMPLE.map(r=>r.slice()),SAMPLE_NAME);setStatus(t('sampleLoaded',{f:SAMPLE_NAME}),'ok')};
async function handleFile(f){
 if(!f)return;setStatus(t('parsing',{f:f.name}));await new Promise(r=>setTimeout(r,20));
 try{const objs=await readObjs(f),r=parseObjs(objs,f.name);
  if(r.error){setStatus(f.name+': '+r.error,'err');return}
  setFills(r.fills,f.name);setStatus(t('loaded',{f:f.name,n:fmt(r.fills.length),r:fmt(r.rows),i:Object.keys(BY).length,d:r.days}),'ok');
 }catch(e){setStatus(t('readFail',{f:f.name})+(e.message==='xlsx'?' (Excel library)':''),'err')}
}
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.classList.add('drop')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.classList.remove('drop')}));
document.addEventListener('drop',e=>{if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
/* ---------- export ---------- */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const barRows=()=>BARS.map(x=>({Time:tfmt(x.t,true)+(TF>=86400?'':' '+new Date(x.t*1000).getUTCFullYear()),Open:x.o,High:x.h,Low:x.l,Close:x.c,Volume:x.v,Trades:x.n}));
const fname=ext=>`MCC_${INS}_${tfName(TF)}.${ext}`;
function exportCsv(){if(!BARS.length)return;const r=barRows(),h=Object.keys(r[0]);dl(new Blob(['﻿'+[h.join(',')].concat(r.map(o=>h.map(k=>o[k]).join(','))).join('\n')],{type:'text/csv'}),fname('csv'))}
$('btnCsv').onclick=exportCsv;
$('btnXls').onclick=()=>{if(!BARS.length)return;if(typeof XLSX==='undefined'){exportCsv();setStatus(t('noXlsx'),'err');return}
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(barRows()),'OHLCV');
 const ov=Object.keys(BY).map(k=>{const a=BY[k];return{Contract:k,Open:a[0][2],Last:a[a.length-1][2],High:Math.max(...a.map(x=>x[2])),Low:Math.min(...a.map(x=>x[2])),Volume:sum(a),Trades:a.length}});
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ov),'Overview');
 const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});dl(new Blob([out],{type:'application/octet-stream'}),fname('xlsx'))};
$('btnPng').onclick=()=>{if(!BARS.length)return;cv.toBlob(b=>dl(b,fname('png')))};
$('btnPrint').onclick=()=>window.print();
/* ---------- init ---------- */
try{const s=localStorage.getItem('mcc-theme');if(s)THEME=s}catch(e){}
applyTheme();applyLang();
if(SAMPLE.length){setFills(SAMPLE.map(r=>r.slice()),SAMPLE_NAME)}else{$('main').hidden=true;$('empty').hidden=false}
</script>
