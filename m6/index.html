<title>Working Order Ladder</title>
<style>
:root{--bg:#0e1621;--pn:#151f2e;--pn2:#1b2738;--ln:#263449;--tx:#e6edf5;--mu:#8a9bb2;--ac:#f5a524;--hd:#1f3350;--hdt:#e6edf5;--act:#111;--bid:rgba(47,191,113,.28);--ask:rgba(239,83,80,.28);--bidt:#2fbf71;--askt:#ef5350;--rd:#ef5350;--gn:#2fbf71}
:root[data-theme=light]{--bg:#f3f5f8;--pn:#fff;--pn2:#eef2f7;--ln:#d5dce6;--tx:#17212f;--mu:#5d6c80;--ac:#c77700;--hd:#dfe8f4;--hdt:#17212f;--act:#fff;--bid:rgba(27,138,75,.22);--ask:rgba(198,40,40,.2);--bidt:#1b8a4b;--askt:#c62828;--rd:#c62828;--gn:#1b8a4b}
:root[data-theme=green]{--bg:#eef1ee;--pn:#fff;--pn2:#f1f5f0;--ln:#cfd9cd;--tx:#1b2a1b;--mu:#5a6b5a;--ac:#2e7d32;--hd:#2e7d32;--hdt:#fff;--act:#fff;--hb:#2e7d32;--hbt:#fff;--bid:rgba(46,125,50,.22);--ask:rgba(198,40,40,.2);--bidt:#2e7d32;--askt:#c62828;--rd:#c62828;--gn:#2e7d32}
:root[data-theme=burgundy]{--bg:#f4eeee;--pn:#fff;--pn2:#f6eded;--ln:#dccaca;--tx:#2a1717;--mu:#755a5a;--ac:#8c1c2c;--hd:#8c1c2c;--hdt:#fff;--act:#fff;--hb:#8c1c2c;--hbt:#fff;--bid:rgba(46,125,50,.22);--ask:rgba(198,40,40,.2);--bidt:#2e7d32;--askt:#c62828;--rd:#c62828;--gn:#2e7d32}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--hb,var(--pn));color:var(--hbt,var(--tx));border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:30}
h1{font-size:16px;margin:0 12px 0 0}h1 small{opacity:.75;font-weight:400;margin-left:8px;font-size:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:5px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
:root[data-theme=green] header button.pri,:root[data-theme=burgundy] header button.pri{background:#fff;color:var(--hb);border-color:#fff}
.sp{flex:1}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
.bar label{color:var(--mu);font-size:12px;display:flex;gap:5px;align-items:center}
.note{color:var(--mu);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(360px,1fr);gap:12px;padding:12px 16px;align-items:start}
@media(max-width:1100px){main{grid-template-columns:1fr}}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:10px 12px;min-width:0}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.sum div{background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:6px 9px}.sum span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase}.sum b{font-size:15px}
.tw{overflow:auto;max-height:74vh;border:1px solid var(--ln);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:3px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;text-align:right}
th{background:var(--hd);color:var(--hdt);position:sticky;top:0;z-index:2}
th.l,td.l{text-align:left}
.lad td{padding:2px 6px;height:27px}
.lad td.px{text-align:center;font-weight:700;background:var(--pn2);min-width:86px}
.lad td.bq,.lad td.aq{font-weight:600;min-width:54px}
.lad td.ow{width:30%;min-width:210px;white-space:normal}
.lad td.bw{text-align:right}.lad td.aw{text-align:left}
.lad tr.bb td.px{outline:2px solid var(--bidt);outline-offset:-2px}.lad tr.ba td.px{outline:2px solid var(--askt);outline-offset:-2px}
.lad tr.fx td{box-shadow:inset 0 0 0 9999px rgba(245,165,36,.13)}
.lad tr.sp td{background:var(--pn2);color:var(--mu);font-size:11px;text-align:center;height:18px;padding:0}
.ch{display:inline-block;border-radius:10px;padding:0 7px;margin:1px 2px;font-size:11.5px;color:#fff;cursor:pointer;line-height:19px;border:2px solid transparent}
.ch.f{border-color:var(--tx);box-shadow:0 0 0 1px var(--pn)}
.ch.m{background:var(--mu)!important;cursor:default}
.tag{display:inline-block;border-radius:4px;padding:0 6px;margin:1px 2px;font-size:11px;font-weight:700;color:#fff}
.t-BIG{background:#d98a00}.t-DOM{background:#7b3fe4}.t-LAYER{background:#0b7fbf}.t-SELFX{background:#d32f2f}.t-TWO{background:#607d8b}.t-TOUCH{background:#8d6e63}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin:-4px 0 8px;overflow:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mu);padding:7px 11px;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
tr.lk{cursor:pointer}tr.lk:hover td{background:var(--pn2)}
.warn{background:rgba(245,165,36,.13);border:1px solid var(--ac);border-radius:6px;padding:6px 10px;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
input.n{width:84px;text-align:right}
.tip{position:fixed;pointer-events:none;background:#000e;color:#fff;padding:5px 8px;border-radius:4px;font-size:12px;z-index:60;display:none;white-space:pre;max-width:420px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:70}
.modal.on{display:flex}.modal>div{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:16px;max-width:620px;width:94%;max-height:88vh;overflow:auto}
.dz{border:2px dashed var(--ln);border-radius:8px;padding:30px;text-align:center;color:var(--mu);margin:12px 0}.dz.over{border-color:var(--ac);color:var(--ac)}
.wl{display:inline-flex;align-items:center;gap:3px}.wl button{padding:0 5px}
input[type=range]{padding:0;width:260px;accent-color:var(--ac)}
</style>

function parseCSV(tx){tx=tx.replace(/^﻿/,'');const first=tx.split(/\r?\n/,1)[0];const dl=[',',';','\t'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<tx.length;i++){const ch=tx[i];if(q){if(ch==='"'){if(tx[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===dl){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
async function readRows(f){const n=f.name.toLowerCase();if(/\.(csv|txt)$/.test(n))return parseCSV(await f.text());
  if(!window.XLSX)throw new Error('SheetJS belum termuat (perlu internet) — simpan sebagai CSV lalu import ulang.');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
const FIELDS=[['ins','Instrument Id',1,['instrumentid','instrument','contractticker','contract','symbol']],['side','B/S',1,['bs','side','buysell','direction','bidask']],['price','Price',1,['price','orderprice','limitprice']],['vol','Volume (awal)',0,['volume','orderqty','quantity','qty','ordervolume','originalvolume','totalvolume','orderquantity']],['rem','Remaining',0,['remainingvolume','remaining','leavesqty','leaves','volumeleft','openvolume','workingvolume','remainingqty']],['trd','Traded',0,['tradedvolume','filledqty','tradevolume','executedvolume','volumetraded','cumqty','filled','tradedqty']],['inv','Investor Id',0,['investorid','subaccount','investor','pa','accountid','account']],['brk','Broker Id',0,['brokerid','tradingaccountnumber','tradingaccount','broker','cm']],['status','Order Status',0,['orderstatus','status']],['t0','Order Time',0,['ordertime','inserttime','entrytime','createdtime','submittime','createtime','time']],['t1','Update Time',0,['updatetime','updatedtime','canceltime','lasttime','modifytime']],['oid','Order Sysid',0,['ordersysid','orderid','orderno','ordersystemid','ordernumber','clordid']]];
const nz=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9\/]/g,'').replace('/','');
function autoMap(hdr){const idx={};hdr.forEach((h,i)=>{const k=nz(h);if(k&&idx[k]===undefined)idx[k]=i});const mp={};
  for(const [f,,,al] of FIELDS){for(const a of al){if(idx[a]!==undefined){mp[f]=idx[a];break}}}return mp}
function findHeader(rows){let best=-1,bs=0;for(let i=0;i<Math.min(rows.length,30);i++){const sc=Object.keys(autoMap(rows[i])).length;if(sc>bs){bs=sc;best=i}}return bs>=3?best:-1}
function reqOk(mp){return mp.ins!==undefined&&mp.side!==undefined&&mp.price!==undefined&&(mp.vol!==undefined||mp.rem!==undefined)}
function showModal(html){$('#mbody').innerHTML=html;$('#modal').classList.add('on')}

function mapDialog(rows,hi,mp,done){

  showModal('<h3 style="margin-top:0">'+t('Mapping kolom')+'</h3>'+(reqOk(mp)?'':'<div class="warn">'+t('Kolom wajib belum dipetakan')+'</div>')+
   '<table>'+FIELDS.map(([f,lab,req])=>'<tr><td class="l">'+lab+(req?' *':'')+'</td><td class="l"><select data-f="'+f+'"><option value="">—</option>'+hdr.map((h,i)=>'<option value="'+i+'"'+(mp[f]===i?' selected':'')+'>'+esc(h)+'</option>').join('')+'</select></td></tr>').join('')+'</table>'+
   '<div class="row"><button class="pri" id="mOk">'+t('Terapkan')+'</button><button id="mNo">'+t('Batal')+'</button></div>');
  $('#mNo').onclick=closeModal;
  $('#mOk').onclick=()=>{const m2={};document.querySelectorAll('#mbody select[data-f]').forEach(s=>{if(s.value!=='')m2[s.dataset.f]=+s.value});if(!reqOk(m2)){mapDialog(rows,hi,m2,done);return}closeModal();done(m2)}}
function sideOf(v){const s=String(v).trim().toLowerCase();if(/^(b|buy|bid|1|long)/.test(s))return 'B';if(/^(s|sell|ask|offer|2|short|sale)/.test(s))return 'S';return ''}
const CLOSED=/cancel|reject|expire|withdraw|delet|inactive|kill|done|complet|alltraded|fully|^filled$|^traded$|full/i;
function build(rows,hi,mp){
  const out=[];let skipped=0;
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const g=f=>mp[f]===undefined?'':r[mp[f]];
    const ins=String(g('ins')).trim(),side=sideOf(g('side')),price=+g('price');
    if(!ins||!side||!(price>0)){if(ins||g('price')!=='')skipped++;continue}
    let vol=g('vol')===''?NaN:+g('vol'),trd=g('trd')===''?0:+g('trd'),rem=g('rem')===''?NaN:+g('rem');
    if(isNaN(vol)&&!isNaN(rem))vol=rem+trd;if(isNaN(rem))rem=Math.max(0,vol-trd);
    if(!(vol>0)){skipped++;continue}
    const st=String(g('status')).trim();
    const closed=!CFG.ignStatus&&((st&&!/part/i.test(st)&&CLOSED.test(st.replace(/[\s_-]/g,'')))||rem<=0);
    out.push({id:String(g('oid')).trim()||('r'+i),ins,inv:String(g('inv')).trim()||'—',brk:String(g('brk')).trim(),side,p:price,vol,trd,rem,st,t0:parseTs(g('t0')),t1:parseTs(g('t1')),closed:!!closed})}
  return {out,skipped}}
async function importFiles(files){
  const all=[],lines=[];let pending=0;
  for(const f of files){
    let rows;try{rows=await readRows(f)}catch(e){lines.push(f.name+': '+e.message);continue}
    LASTROWS=rows;let hi=findHeader(rows),mp=hi>=0?autoMap(rows[hi]):{};
    if(hi<0||!reqOk(mp)){await new Promise(res=>{mapDialog(rows,Math.max(0,hi),mp,m2=>{const b=build(rows,Math.max(0,hi),m2);all.push(...b.out);lines.push(f.name+': '+b.out.length+' '+t('baris'));res()});$('#mNo').onclick=()=>{closeModal();lines.push(f.name+': —');res()}});continue}
    const b=build(rows,hi,mp);all.push(...b.out);lines.push(f.name+': '+f0(b.out.length)+' '+t('baris')+(b.skipped?' (skip '+b.skipped+')':''))}
  if(all.length){await setOrders(all,files.map(f=>f.name).join(', '))}
  msg(t('Hasil import'),lines.concat(all.length?[f0(all.filter(o=>!o.closed).length)+' '+t('order aktif')+' · '+f0(all.filter(o=>o.closed).length)+' '+t('dikecualikan status')]:[]))}
async function setOrders(arr,name){ORD=arr;META={file:name,n:arr.length,hasTime:arr.some(o=>o.t0!=null)};VER++;S.asof=null;S.dsel=null;await kvSet('orders',{ORD,META});initControls();render()}

let LC=null;
function timeline(){const s=new Set();for(const o of ORD){if(o.t0!=null)s.add(o.t0);if(o.closed&&o.t1!=null)s.add(o.t1)}return [...s].sort((a,b)=>a-b)}
function live(){
  const key=VER+'|'+S.asof+'|'+S.brk+'|'+CFG.ignStatus;if(LC&&LC.key===key)return LC.v;
  const T=S.asof,v=[];
  for(const o of ORD){if(S.brk&&o.brk!==S.brk)continue;
    if(T==null){if(o.closed)continue;v.push(Object.assign({q:o.rem},o))}
    else{if(o.t0==null||o.t0>T)continue;if(o.closed&&!(o.t1!=null&&o.t1>T))continue;v.push(Object.assign({q:o.vol},o))}}
  LC={key,v};return v}
function bookOf(ins,L_){
  const tk=tickOf(ins),lv=new Map();let bb=-Infinity,ba=Infinity,bt=0,at=0,bn=0,an=0;const invs=new Set();
  for(const o of L_){if(o.ins!==ins)continue;const ti=Math.round(o.p/tk);let l=lv.get(ti);if(!l){l={ti,b:{q:0,n:0,m:new Map,os:[]},a:{q:0,n:0,m:new Map,os:[]}};lv.set(ti,l)}
    const sd=o.side==='B'?l.b:l.a;sd.q+=o.q;sd.n++;sd.os.push(o);const e=sd.m.get(o.inv)||{q:0,n:0};e.q+=o.q;e.n++;sd.m.set(o.inv,e);invs.add(o.inv);
    if(o.side==='B'){bt+=o.q;bn++;if(ti>bb)bb=ti}else{at+=o.q;an++;if(ti<ba)ba=ti}}
  return {tk,lv,bb:isFinite(bb)?bb:null,ba:isFinite(ba)?ba:null,bt,at,bn,an,invs}}
/* ---------- deteksi ---------- */
function detect(L_){
  const res=[],by=new Map();for(const o of L_){let a=by.get(o.ins);if(!a){a=[];by.set(o.ins,a)}a.push(o)}
  for(const [ins,os] of by){const bk=bookOf(ins,os);const m=new Map();
    for(const o of os){let e=m.get(o.inv);if(!e){e={ins,inv:o.inv,brk:o.brk,bq:0,aq:0,bn:0,an:0,bl:new Set(),al:new Set(),maxQ:0,touch:false,minAsk:Infinity,maxBid:-Infinity};m.set(o.inv,e)}
      const ti=Math.round(o.p/bk.tk);if(o.q>e.maxQ)e.maxQ=o.q;
      if(o.side==='B'){e.bq+=o.q;e.bn++;e.bl.add(ti);if(ti>e.maxBid)e.maxBid=ti;if(ti===bk.bb)e.touch=true}else{e.aq+=o.q;e.an++;e.al.add(ti);if(ti<e.minAsk)e.minAsk=ti;if(ti===bk.ba)e.touch=true}}
    for(const e of m.values()){const fl=[];e.bs=bk.bt?e.bq/bk.bt*100:0;e.as=bk.at?e.aq/bk.at*100:0;
      if(e.maxQ>=CFG.big)fl.push('BIG');
      if((bk.bn>e.bn&&e.bs>=CFG.dom)||(bk.an>e.an&&e.as>=CFG.dom))fl.push('DOM');
      if(e.bl.size>=CFG.layer||e.al.size>=CFG.layer)fl.push('LAYER');
      if(e.maxBid>=e.minAsk&&isFinite(e.minAsk)&&isFinite(e.maxBid))fl.push('SELFX');
      if(e.bq>0&&e.aq>0)fl.push('TWO');
      if(e.touch)fl.push('TOUCH');
      e.fl=fl;e.score=fl.reduce((a,f)=>a+{BIG:2,DOM:3,LAYER:3,SELFX:5,TWO:1,TOUCH:1}[f],0);
      e.reason=fl.map(f=>({BIG:'max '+f0(e.maxQ)+' lot',DOM:'bid '+e.bs.toFixed(0)+'% / ask '+e.as.toFixed(0)+'%',LAYER:e.bl.size+'/'+e.al.size+' level',SELFX:'bid '+(e.maxBid*bk.tk).toFixed(decOf(bk.tk))+' ≥ ask '+(e.minAsk*bk.tk).toFixed(decOf(bk.tk)),TWO:'2-sided',TOUCH:'best'}[f])).join(' · ');
      res.push(e)}}
  return res.sort((a,b)=>b.score-a.score||b.bq+b.aq-a.bq-a.aq)}

function chips(m,side){
  const arr=[...m.entries()].sort((a,b)=>b[1].q-a[1].q),sh=arr.slice(0,3);
  return sh.map(([inv,e])=>'<span class="ch'+(S.focus.has(inv)?' f':'')+'" data-inv="'+esc(inv)+'" style="background:'+chCol(inv)+'">'+esc(inv)+' · '+f0(e.q)+(e.n>1?' ×'+e.n:'')+'</span>').join('')+(arr.length>3?'<span class="ch m" data-more="1">+'+(arr.length-3)+'</span>':'')}
function ladder(){
  const L_=live(),ins=S.ins,bk=bookOf(ins,L_),tk=bk.tk,dec=decOf(tk);
  if(!bk.lv.size)return {html:'<div class="note">'+t('Tidak ada order')+'</div>',bk,rows:[]};
  const tis=[...bk.lv.keys()];let lo,hi;const mid=bk.bb!=null&&bk.ba!=null?Math.round((bk.bb+bk.ba)/2):(bk.bb!=null?bk.bb:bk.ba);
  lo=mid-CFG.win;hi=mid+CFG.win;const out=tis.filter(x=>x<lo||x>hi).length;
  if(bk.bb!=null&&bk.ba!=null){lo=Math.min(lo,bk.bb);hi=Math.max(hi,bk.ba)}
  let rows=[];
  if(CFG.cmp){for(const ti of tis)if(ti>=lo&&ti<=hi)rows.push(ti);rows.sort((a,b)=>b-a)}
  else for(let ti=hi;ti>=lo;ti--)rows.push(ti);
  const maxQ=Math.max(1,...[...bk.lv.values()].map(l=>Math.max(l.b.q,l.a.q)));
  const empt={q:0,n:0,m:new Map(),os:[]};
  let h='<table class="lad"><tr><th>'+t('Pemilik order (Investor Id · qty)')+' · Bid</th><th>'+t('Qty')+'</th><th>'+t('Harga')+'</th><th>'+t('Qty')+'</th><th class="l">'+t('Pemilik order (Investor Id · qty)')+' · Ask</th></tr>';
  const rr=[];
  for(const ti of rows){const l=bk.lv.get(ti)||{b:empt,a:empt};
    const fx=[...l.b.m.keys(),...l.a.m.keys()].some(i=>S.focus.has(i));
    const cls=(ti===bk.bb?'bb ':'')+(ti===bk.ba?'ba ':'')+(fx?'fx':'');
    const bw=l.b.q?'linear-gradient(to left,var(--bid) '+(l.b.q/maxQ*100)+'%,transparent 0)':'',aw=l.a.q?'linear-gradient(to right,var(--ask) '+(l.a.q/maxQ*100)+'%,transparent 0)':'';
    h+='<tr class="'+cls+'" data-ti="'+ti+'"><td class="ow bw">'+(l.b.q?chips(l.b.m,'B'):'')+'</td><td class="bq" style="background:'+bw+';color:var(--bidt)">'+(l.b.q?f0(l.b.q):'')+'</td><td class="px">'+(ti*tk).toFixed(dec)+(ti===bk.bb?' ◂':'')+(ti===bk.ba?' ▸':'')+'</td><td class="aq" style="background:'+aw+';color:var(--askt)">'+(l.a.q?f0(l.a.q):'')+'</td><td class="ow aw">'+(l.a.q?chips(l.a.m,'S'):'')+'</td></tr>';
    rr.push([(ti*tk).toFixed(dec),[...l.b.m.entries()].map(([i,e])=>i+':'+e.q).join('; '),l.b.q||'',l.a.q||'',[...l.a.m.entries()].map(([i,e])=>i+':'+e.q).join('; ')])}
  h+='</table>';
  return {html:h,bk,rows:rr,out}}

function pSet(){
  const prods=[...new Set([...Object.keys(CFG.tick),...ORD.map(o=>prodOf(o.ins))])];
  const st=new Map();for(const o of ORD)st.set(o.st||'—',[(st.get(o.st||'—')||[0,o.closed])[0]+1,o.closed]);
  let h='<div class="row"><label>'+t('Ukuran order besar (lot ≥)')+' <input class="n" id="sBig" value="'+CFG.big+'"></label></div><div class="row"><label>'+t('Dominasi sisi (% ≥)')+' <input class="n" id="sDom" value="'+CFG.dom+'"></label></div><div class="row"><label>'+t('Layering (jumlah level ≥)')+' <input class="n" id="sLay" value="'+CFG.layer+'"></label></div>'+
   '<h3>'+t('Tick size per produk')+'</h3><div class="row">'+prods.map(p=>'<label>'+p+' <input class="n" data-tk="'+p+'" value="'+(CFG.tick[p]||'')+'"></label>').join('')+'</div>'+
   '<h3>'+t('Status order')+'</h3><div class="row"><label><input type="checkbox" id="sIgn"'+(CFG.ignStatus?' checked':'')+'> '+t('Abaikan status (anggap semua order aktif)')+'</label></div>'+
   '<div class="tw" style="max-height:140px"><table>'+[...st.entries()].map(([k,[n,c]])=>'<tr><td class="l">'+esc(k)+'</td><td>'+f0(n)+'</td><td class="l">'+(c?'✕':'✓')+'</td></tr>').join('')+'</table></div>'+
   (LASTROWS?'<div class="row"><button id="bMap">'+t('Ubah mapping kolom')+'</button></div>':'');
  return {h,bind:()=>{
    const num=(id,k)=>{$(id).onchange=e=>{CFG[k]=+e.target.value||CFG[k];saveCfg();LC=null;render()}};num('#sBig','big');num('#sDom','dom');num('#sLay','layer');
    document.querySelectorAll('[data-tk]').forEach(e=>e.onchange=()=>{CFG.tick[e.dataset.tk]=+e.value||0.01;saveCfg();render()});
    $('#sIgn').onchange=async e=>{CFG.ignStatus=e.target.checked;await saveCfg();if(LASTROWS){const hi=findHeader(LASTROWS);if(hi>=0){const b=build(LASTROWS,hi,autoMap(LASTROWS[hi]));await setOrders(b.out,META?META.file:'')}}else{for(const o of ORD)o.closed=CFG.ignStatus?false:o.closed;VER++;LC=null;render()}};
    const bm=$('#bMap');if(bm)bm.onclick=()=>{const hi=Math.max(0,findHeader(LASTROWS));mapDialog(LASTROWS,hi,autoMap(LASTROWS[hi]),async m2=>{const b=build(LASTROWS,hi,m2);await setOrders(b.out,META?META.file:'')})}}}}
/* ---------- render ---------- */
function bindTip(){document.querySelectorAll('.lad tr[data-ti]').forEach(r=>{r.onmousemove=e=>{const ti=+r.dataset.ti,bk=CUR.bk,l=bk.lv.get(ti);const tp=$('#tip');if(!l){tp.style.display='none';return}
  const f=(a,nm)=>a.os.slice(0,12).map(o=>nm+' '+o.inv+' · '+f0(o.q)+' · '+o.id+(o.t0!=null?' · '+tsLab(o.t0):'')).join('\n')+(a.os.length>12?'\n… +'+(a.os.length-12):'');
  tp.textContent=(f(l.b,'BID')+(l.b.q&&l.a.q?'\n':'')+f(l.a,'ASK'));tp.style.display='block';tp.style.left=(e.clientX+14)+'px';tp.style.top=(e.clientY+12)+'px'};r.onmouseleave=()=>{$('#tip').style.display='none'}});
  document.querySelectorAll('.ch[data-inv]').forEach(c=>c.onclick=e=>{e.stopPropagation();toggleFocus(c.dataset.inv)})}
let CUR=null,RTAB='det';
function render(){
  if(!ORD.length){$('#root').innerHTML='<div style="padding:16px"><div class="dz" id="dz">'+t('Seret file order (CSV/Excel) ke sini')+'<br><span class="note">'+t('Belum ada data. Klik Import Order, atau Contoh simulasi.')+'</span></div></div>';$('#dz').onclick=()=>$('#fIn').click();$('#stat').textContent='';return}
  const ld=ladder();CUR=ld;const keepY=($('#lw')||{}).scrollTop;
  const tabs=RT.map(x=>'<button data-rt="'+x[0]+'" class="'+(RTAB===x[0]?'on':'')+'">'+t(x[1])+'</button>').join('');
  const P={det:pDet,inv:pInv,ord:pOrd,set:pSet}[RTAB]();
  $('#root').innerHTML='<main><div class="card"><h3>'+esc(S.ins)+' · '+t('Pemilik order (Investor Id · qty)')+'</h3>'+summary(ld.bk)+(ld.out?'<div class="note">'+t('Order di luar window')+': '+ld.out+'</div>':'')+'<div class="tw" id="lw">'+ld.html+'</div></div><div class="card"><div class="tabs">'+tabs+'</div><div id="rp">'+P.h+'</div></div></main>';
  P.bind();document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{RTAB=b.dataset.rt;render()});bindTip();
  const lw=$('#lw');if(lw){if(keepY!=null&&lw.dataset)lw.scrollTop=keepY;const b=lw.querySelector('tr.bb,tr.ba');if(b&&!keepY)lw.scrollTop=Math.max(0,b.offsetTop-lw.clientHeight/2)}
  $('#stat').textContent=(META?META.file+' · ':'')+f0(live().length)+' '+t('order aktif')+(S.asof!=null?' @ '+tsLab(S.asof):'')}
/* ---------- replay ---------- */
function setT(i){const tl=timeline();if(!tl.length)return;S.asof=i>=tl.length-1?null:tl[Math.max(0,i)];$('#tSl').value=S.asof==null?tl.length-1:i;$('#tLab').textContent=S.asof==null?t('Akhir (snapshot)'):tsLab(S.asof);LC=null;initControlsLite();render()}
function initControlsLite(){const cnt=new Map();for(const o of live())cnt.set(o.ins,(cnt.get(o.ins)||0)+1);[...$('#fIns').options].forEach(op=>{op.text=op.value+' ('+(cnt.get(op.value)||0)+')'})}
function stopPlay(){if(S.play){clearInterval(S.play);S.play=null;$('#tPlay').textContent='▶'}}
/* ---------- export ---------- */
function fname(e){return 'working-order_'+S.ins+(S.asof!=null?'_'+tsLab(S.asof).replace(/:/g,''):'')+'.'+e}
function aoas(){const tk=tickOf(S.ins);const ld=ladder();
  return {lad:[[t('Harga'),'Bid owners','Bid qty','Ask qty','Ask owners'],...ld.rows],
   det:[[t('Investor'),t('Instrumen'),'Broker','Bid qty','Ask qty',t('Level bid'),t('Level ask'),'Max qty',t('Deteksi'),t('Alasan'),t('Skor')],...detect(live()).map(e=>[e.inv,e.ins,e.brk,e.bq,e.aq,e.bl.size,e.al.size,e.maxQ,e.fl.join(' '),e.reason,e.score])],
   ord:[['Order Sysid','Investor Id','Broker Id','Instrument Id','B/S','Price','Qty','Volume','Traded','Status','Time'],...live().map(o=>[o.id,o.inv,o.brk,o.ins,o.side,o.p,o.q,o.vol,o.trd,o.st,tsLab(o.t0)])]}}
function exportXls(){if(!window.XLSX){alert(t('Ekspor Excel gagal (library belum termuat — perlu internet).'));return}
  const A=aoas(),wb=XLSX.utils.book_new();[['Ladder '+S.ins.slice(-13),A.lad],['Deteksi',A.det],['Orders',A.ord]].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n.slice(0,31)));XLSX.writeFile(wb,fname('xlsx'))}
function exportPdf(){if(!window.jspdf||!(window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable)){alert(t('Ekspor PDF gagal (library belum termuat — perlu internet).'));return}
  const TC={green:[46,125,50],burgundy:[140,28,44],dark:[31,51,80],light:[31,51,80]}[CFG.theme]||[46,125,50];
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});doc.setFillColor(TC[0],TC[1],TC[2]);doc.rect(0,0,842,44,'F');doc.setTextColor(255,255,255);doc.setFontSize(16);doc.text('Working Order — '+S.ins,36,28);doc.setTextColor(0,0,0);doc.setFontSize(9);
  doc.text((META?META.file:'')+(S.asof!=null?'  |  '+tsLab(S.asof):'')+(S.brk?'  |  '+S.brk:''),36,60);
  const A=aoas();const tb=(title,a,y)=>{doc.setFontSize(11);doc.text(title,36,y);doc.autoTable({startY:y+6,head:[a[0]],body:a.slice(1).map(r=>r.map(c=>typeof c==='number'?f0(c):c)),styles:{fontSize:7.5,cellPadding:2.5},headStyles:{fillColor:TC,textColor:255},alternateRowStyles:{fillColor:[240,240,240]},margin:{left:36,right:36}})};
  tb('Ladder',A.lad,78);tb(t('Deteksi'),A.det.slice(0,60),(doc.lastAutoTable?doc.lastAutoTable.finalY:78)+22);doc.save(fname('pdf'))}
/* ---------- template ---------- */
function tplCsv(){const t_='Broker Id,Investor Id,Instrument Id,Order Sysid,B/S,Price,Volume,Traded Volume,Remaining Volume,Order Status,Order Time,Update Time\n1001A,10015550003,F-XACM-NSI-202612,2026112400001,B,49.195,5,0,5,Working,09:01:10,09:01:10\n1001B,10017890002,F-XACM-NSI-202612,2026112400002,S,49.215,3,1,2,Partially Filled,09:02:30,09:05:12\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t_],{type:'text/csv'}));a.download='template_working_order.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
/* ---------- init ---------- */
async function init(){
  const c=await kvGet('cfg');if(c){CFG=Object.assign({},DEF,c);CFG.tick=Object.assign({},DEF.tick,c.tick)}
  const d=await kvGet('orders');if(d&&d.ORD){ORD=d.ORD;META=d.META}
  document.documentElement.dataset.theme=CFG.theme;$('#lang').value=CFG.lang;$('#theme').value=CFG.theme;
  applyLang();initControls();render()}
$('#bImp').onclick=()=>$('#fIn').click();
$('#fIn').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f)};
$('#bSample').onclick=async()=>{if(!SAMPLE)return;const rows=parseCSV(SAMPLE);LASTROWS=rows;const hi=findHeader(rows);const b=build(rows,hi,autoMap(rows[hi]));await setOrders(b.out,'sample_simulasi.csv');msg(t('Contoh simulasi'),[t('Data contoh adalah SIMULASI, bukan data bursa.')])};
$('#bTpl').onclick=tplCsv;$('#bXls').onclick=exportXls;$('#bPdf').onclick=exportPdf;
$('#lang').onchange=e=>{CFG.lang=e.target.value;saveCfg();applyLang();initControls();render()};
$('#theme').onchange=e=>{CFG.theme=e.target.value;document.documentElement.dataset.theme=CFG.theme;saveCfg()};
$('#fIns').onchange=e=>{S.ins=e.target.value;render()};
$('#fBrk').onchange=e=>{S.brk=e.target.value;LC=null;initControlsLite();render()};
$('#fWin').onchange=e=>{CFG.win=Math.max(3,+e.target.value||25);saveCfg();render()};
$('#fCmp').onchange=e=>{CFG.cmp=e.target.checked;saveCfg();render()};
$('#fInv').onkeydown=e=>{if(e.key==='Enter'){for(const v of e.target.value.split(/[,\s]+/).filter(Boolean))S.focus.add(v);e.target.value='';drawWL();render()}};
$('#tSl').oninput=e=>{stopPlay();setT(+e.target.value)};
$('#tEnd').onclick=()=>{stopPlay();S.asof=null;LC=null;initControls();$('#tLab').textContent='';render()};
$('#tPrev').onclick=()=>{stopPlay();setT(+$('#tSl').value-1)};$('#tNext').onclick=()=>{stopPlay();setT(+$('#tSl').value+1)};
$('#tPlay').onclick=()=>{if(S.play){stopPlay();return}const tl=timeline();let i=S.asof==null?0:Math.max(0,tl.findIndex(x=>x>=S.asof));$('#tPlay').textContent='❚❚';S.play=setInterval(()=>{if(i>=tl.length-1){stopPlay();return}setT(i++)},350)};
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)importFiles([...e.dataTransfer.files])});
init();
</script>
</body>
</html>
