<style>
/* Layout: header with language/upload/export actions, filter bar, KPI strip, leaderboards, hourly chart + product mix, firm x broker matrix, full ranking, trade detail. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#131a24; --ink2:#4c5766; --ink3:#7a8595; --line:#e1e6ed; --grid:#edf0f4;
  --bar:#5a6b85; --hover:#eef2f8; --focus:#2a78d6; --ok:#0a7d52; --bad:#c0392b;
  --pc0:#2a78d6; --pc1:#eb6834; --pc2:#1baf7a; --pc3:#eda100; --pc4:#e87ba4; --pc5:#008300; --pc6:#6250d6; --pc7:#e34948;
  --long:#2a78d6; --short:#eb6834;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --ink:#eef1f5; --ink2:#b4bdca; --ink3:#8590a0; --line:#2a3340; --grid:#222b37;
  --bar:#8394b0; --hover:#1f2833; --focus:#6aa6f0; --ok:#3fc592; --bad:#ef7b6e;
  --pc0:#3987e5; --pc1:#d95926; --pc2:#199e70; --pc3:#c98500; --pc4:#d55181; --pc5:#0ca30c; --pc6:#9085e9; --pc7:#e66767;
  --long:#3987e5; --short:#d95926; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --ink:#eef1f5; --ink2:#b4bdca; --ink3:#8590a0; --line:#2a3340; --grid:#222b37;
  --bar:#8394b0; --hover:#1f2833; --focus:#6aa6f0; --ok:#3fc592; --bad:#ef7b6e;
  --pc0:#3987e5; --pc1:#d95926; --pc2:#199e70; --pc3:#c98500; --pc4:#d55181; --pc5:#0ca30c; --pc6:#9085e9; --pc7:#e66767;
  --long:#3987e5; --short:#d95926; color-scheme:dark}
/* Bloomberg skin: black ground, amber labels, white data, terminal mono type */
:root[data-skin="bloomberg"]{
  --bg:#000000; --surface:#0a0a0a; --ink:#ffffff; --ink2:#fb8b1e; --ink3:#b0701f; --line:#3b2a0f; --grid:#1a1409;
  --bar:#fb8b1e; --hover:#1c1306; --focus:#4af6c3; --ok:#4af6c3; --bad:#ff433d;
  --pc0:#3d8bff; --pc1:#fb8b1e; --pc2:#4af6c3; --pc3:#ffd700; --pc4:#c97cff; --pc5:#7ed321; --pc6:#00d1ff; --pc7:#ff433d;
  --long:#4af6c3; --short:#ff433d; color-scheme:dark;
  --font:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --head:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-skin="bloomberg"] :is(.card,.kpi,.btn,.seg,.seg button,.tablewrap,select,input[type=search],.chip,.status,.pager button,.tip,.bc .t,.bc .t i,.hb .t,.hb .t i,.board .track,.board .track i,.reset){border-radius:2px!important}
:root[data-skin="bloomberg"] h1{color:#fb8b1e;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
:root[data-skin="bloomberg"] .card h2{color:#fb8b1e;text-transform:uppercase;letter-spacing:.05em;font-size:13px}
:root[data-skin="bloomberg"] .seg button[aria-pressed="true"],:root[data-skin="bloomberg"] .btn.primary{background:#fb8b1e;color:#000;border-color:#fb8b1e}
:root[data-skin="bloomberg"] .btn.primary:hover{background:#ffa84d}
:root[data-skin="bloomberg"] .tip{background:#fb8b1e;color:#000}
:root[data-skin="bloomberg"] .kpi .v{color:#fff}
:root[data-skin="bloomberg"] th{color:#fb8b1e}
:root[data-skin="bloomberg"] tbody tr:hover{background:#241703}
:root[data-skin="bloomberg"] .sub,:root[data-skin="bloomberg"] .card .hint{color:#b0701f}
@media print{.actions,.filters,.toolbar,.pager,.status{display:none!important}body{background:#fff!important;color:#000!important}.tablewrap{overflow:visible}.card,.kpi{break-inside:avoid}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:none;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
h1{font:600 24px/1.15 var(--head);margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 13px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)} .btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.status{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);display:flex;gap:10px;align-items:center;justify-content:space-between}
.status.ok{border-color:var(--ok);color:var(--ok)} .status.err{border-color:var(--bad);color:var(--bad)}
.status button{border:0;background:none;color:inherit;cursor:pointer;font-size:16px;line-height:1}
.drop{outline:2px dashed var(--focus);outline-offset:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.seg button{font:500 13px var(--font);color:var(--ink2);background:none;border:0;border-radius:6px;padding:6px 11px;cursor:pointer;min-height:32px}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,select:focus-visible,input:focus-visible,th[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--hover);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 10px}
.chip button{border:0;background:none;color:var(--ink2);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .v{font:600 26px/1.1 var(--head);margin-top:4px}
.kpi .n{font-size:12px;color:var(--ink3);margin-top:2px;overflow-wrap:anywhere}
.kpi.click{cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi.click:hover{background:var(--hover)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font:600 15px/1.2 var(--head);margin:0 0 2px}
.card .hint{color:var(--ink3);font-size:12px;margin-bottom:12px}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.board li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 4px;margin:0 -4px}
.board li:hover{background:var(--hover)}
.board .r{color:var(--ink3);font-size:12px}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .track{grid-column:2 / 4;height:5px;background:var(--grid);border-radius:3px;margin-top:-3px;overflow:hidden}
.board .track i{display:block;height:100%;background:var(--bar);border-radius:0 3px 3px 0}
.mid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
@media(max-width:820px){.mid{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{fill:var(--ink3);font:11px var(--font)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.hb .t{height:12px;background:var(--grid);border-radius:3px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:0 4px 4px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}
select,input[type=search]{font:13px var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:34px;max-width:100%}
input[type=search]{min-width:160px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600;background:var(--surface);cursor:pointer;user-select:none}
th:hover{color:var(--ink)} th.on{color:var(--ink)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th.tl,td.tl{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
td.rank{color:var(--ink3);width:40px}
td.barcell{width:26%;min-width:170px;text-align:left}
.bc{display:flex;align-items:center;gap:8px}
.bc .t{flex:1;height:10px;background:var(--grid);border-radius:3px;overflow:hidden}
.bc .t i{display:block;height:100%;border-radius:0 4px 4px 0}
.bc b{font-weight:600;min-width:42px;text-align:right}
.pos{color:var(--long)} .neg{color:var(--short)}
.dim{color:var(--ink3)}
.lk{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}
.lk:hover{color:var(--focus)}
.pager{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;color:var(--ink2)}
.pager button{font:500 13px var(--font);background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;min-height:32px}
.pager button:disabled{opacity:.4;cursor:default}
.mx{cursor:pointer;background:none;border:0;font:inherit;color:inherit;padding:2px 6px;border-radius:4px}
.mx:hover{background:var(--hover);color:var(--focus)}
.sidebuy{color:var(--long);font-weight:600}.sidesell{color:var(--short);font-weight:600}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:7px 10px;border-radius:6px;max-width:240px;display:none;line-height:1.4}
.foot{color:var(--ink3);font-size:12px}
.btn[aria-pressed="true"]{background:var(--focus);color:#fff;border-color:var(--focus)}
.xbadge{background:#e34948;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;letter-spacing:.03em}
tr.xrow td{background:color-mix(in srgb,#e34948 9%,transparent)}
.kpi.x .v{color:#e34948}
.navtabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.navtabs button{font:600 14px var(--font);border:0;background:none;color:var(--ink3);padding:9px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.navtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--focus)}
#pgBO{display:flex;flex-direction:column;gap:16px}#pgBO[hidden]{display:none!important}
#pgBO .sub[hidden]{display:none!important}#pgBO .sub{display:flex;flex-direction:column;gap:16px;margin:0;color:inherit}
body.bo-on #btnUpload,body.bo-on #btnSample,body.bo-on .filters{display:none!important}
#pgBO th:first-child,#pgBO td:first-child,#pgBO th:nth-child(2),#pgBO td:nth-child(2){text-align:right}
#pgBO .tl,#pgBO th.tl,#pgBO td.tl{text-align:left!important}
#pgBO .grid table{min-width:0}#pgBO .grid th[data-s]::after{content:attr(data-d);color:var(--focus)}
#pgBO .fr th{cursor:default;padding:3px 6px;background:var(--hover)}#pgBO .gf{width:100%;min-width:62px;font:12px var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
#pgBO tfoot td{border-top:2px solid var(--line);background:var(--hover)}
#pgBO .cfgrow{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}#pgBO .cfgrow input[type=number],#pgBO .cfgrow input[type=text]{font:13px var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
#pgBO table input[type=number]{font:13px var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;text-align:right}
#pgBO .toolbar input:not([type=search]){font:13px var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:32px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line)}
.pill.z-Aman{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:var(--ok)}.pill.z-Waspada{background:color-mix(in srgb,#eda100 18%,transparent);color:#a06b00;border-color:#eda100}
.pill.z-MarginCall,.pill.z-StopOut{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-color:var(--bad)}
.rec2{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;background:var(--hover)}
@media print{body.bo-on .navtabs,body.bo-on header,body.bo-on .noprint,body.bo-on .pager,body.bo-on .fr{display:none!important}body.bo-on #pgBO .card{break-inside:avoid;border:0;padding:4px 0}#pgBO .tablewrap{overflow:visible}#pgBO table{font-size:9px}}
</style>

<div class="wrap" id="app">
  <header>
    <div style="min-width:0">
      <h1>Market Activity Monitor</h1>
      <div class="sub" id="sub"></div>
      <div class="sub foot" id="src"></div>
      <div class="sub foot" id="persp"></div>
    </div>
    <div class="actions">

      <div class="fgroup"><label class="lbl" for="selSkin" data-i="theme"></label><select id="selSkin"></select></div>
      <button class="btn primary" id="btnUpload" data-i="upload"></button>
      <button class="btn" id="btnSample" data-i="sample" hidden></button>
      <button class="btn" id="btnXlsx" data-i="exportXlsx" hidden></button>

<div id="pgMA" style="display:flex;flex-direction:column;gap:16px">
  <div class="filters">

      <div id="hourChart"></div>

      <div class="hint" data-i="mixHint"></div>

  <section class="card">

        <select id="selTop"><option value="10">Top 10</option><option value="20">Top 20</option><option value="0" id="optAll"></option></select></div>

      <div class="pager"><button id="dPrev"></button><span id="dPage"></span><button id="dNext"></button></div>

</div>
<div id="pgBO" hidden></div>
</div>

function aggregate(rows,dim){
  const m=new Map(),d=DIMS.find(x=>x.k===dim);
  const get=k=>{let o=m.get(k);if(!o){o={name:k,trades:0,vol:0,buy:0,sell:0,pv:0,hi:-Infinity,lo:Infinity,last:null,lastTs:-1};m.set(k,o)}return o};
  for(const r of rows){
    if(d.own){const w=wt(r),o=get(r[1]);o.trades+=w;o.vol+=w*r[3];o.pv+=w*r[2]*r[3];o.hi=Math.max(o.hi,r[2]);o.lo=Math.min(o.lo,r[2]);if(r[0]>=o.lastTs){o.lastTs=r[0];o.last=r[2]}}
    else{
      if(sideOn(r,0)){const b=get(r[d.bs[0]]);b.trades++;b.buy+=r[3];b.vol+=r[3]}
      if(sideOn(r,1)){const s=get(r[d.bs[1]]);s.trades++;s.sell+=r[3];s.vol+=r[3]}
    }
  }
  const arr=[...m.values()];
  const tv=arr.reduce((s,o)=>s+o.vol,0);
  arr.forEach(o=>{o.net=o.buy-o.sell;o.vwap=o.vol?o.pv/o.vol:0;o.share=tv?o.vol/tv:0});
  return arr;
}

function kpiData(rows){
  const w=rows.reduce((a,r)=>a+wt(r),0),vol=rows.reduce((a,r)=>a+wt(r)*r[3],0);
  const ins=new Set(rows.map(r=>r[1])),firms=new Set(),trd=new Set();
  rows.forEach(r=>{for(let s=0;s<2;s++)if(sideOn(r,s)){firms.add(r[4+4*s]);trd.add(r[6+4*s])}});
  const hrs=new Map();rows.forEach(r=>hrs.set(hourOf(r),(hrs.get(hourOf(r))||0)+wt(r)*r[3]));
  let ph=null,pv=-1;hrs.forEach((v,h)=>{if(v>pv){pv=v;ph=h}});
  return {vol,ins:ins.size,firms:firms.size,trd:trd.size,ph,pv,trades:w,avg:w?vol/w:0};
}
function crossData(rows){
  const x=rows.filter(isCross),all=rows.reduce((a,r)=>a+r[3],0),m=new Map();

  const invs=[...im.values()].sort((a,b)=>(b.buy+b.sell)-(a.buy+a.sell));
  const vol=trades.reduce((a,r)=>a+r[3],0),ia=new Set();trades.forEach(r=>{if(sideOn(r,0))ia.add(r[5]);if(sideOn(r,1))ia.add(r[9])});
  return {min,trades,orders,invs,vol,share:all?vol/all:0,invCount:ia.size};
}
function hourData(rows){
  const byH=new Map();
  rows.forEach(r=>{const h=hourOf(r);if(!byH.has(h)){const o={t:0};PRODUCTS.forEach(p=>o[p]=0);byH.set(h,o)}const o=byH.get(h),w=wt(r)*r[3];o[prodOf(r)]+=w;o.t+=w});
  return byH;
}
function matrixData(rows){

  return {B:[...brks].sort(),a:[...m.values()].sort((x,y)=>y.t-x.t)};

function searchRows(rows,q){

function setStatus(msg,kind){const s=$('status');s.hidden=!msg;s.className='status'+(kind?' '+kind:'');$('statusMsg').textContent=msg||''}
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const REQ={ins:['instrumentid'],tid:['tradeid'],bs:['bs','buysell','side'],price:['price'],vol:['volume','qty','quantity'],date:['tradedate'],time:['tradetime'],firm:['tradingfirmid','firmid'],brk:['brokerid'],inv:['investorid'],trd:['traderid','userid']};
function pickCols(sample){
  const keys=Object.keys(sample),map={},missing=[];
  const byN={};keys.forEach(k=>byN[norm(k)]=k);
  for(const f in REQ){const hit=REQ[f].find(n=>byN[n]);if(hit)map[f]=byN[hit];else missing.push(REQ[f][0])}
  map.user=byN['userid']||map.trd;map.order=byN['ordersysid']||null;map.tday=byN['tradingday']||null;
  return {map,missing};
}
function toDayNum(v){
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/))return Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/86400000);
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/86400000);
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return Math.floor(Date.UTC(+m[3],+m[2]-1,+m[1])/86400000);
  return NaN;
}
function toSecs(v){
  if(typeof v==='number'&&v>=0&&v<1)return Math.round(v*86400);
  const m=String(v).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m?(+m[1])*3600+(+m[2])*60+(+(m[3]||0)):NaN;
}
function parseTrades(objs,fileName){
  const {map,missing}=pickCols(objs[0]);
  if(missing.length)return {error:t('missingCols',{c:missing.join(', ')})};
  const g=new Map();let bad=0;
  for(const o of objs){
    const id=String(o[map.tid]).trim();if(!id){bad++;continue}
    const sd=String(o[map.bs]).trim().toUpperCase()[0];
    if(sd!=='B'&&sd!=='S'){bad++;continue}
    let e=g.get(id);if(!e){e={};g.set(id,e)}e[sd]=o;
  }
  const tmp=[];let skipped=0,minDay=Infinity,incons=0;
  for(const [id,e] of g){
    if(!e.B||!e.S){skipped++;continue}
    const b=e.B,s=e.S;
    const dn=toDayNum(b[map.date]),sec=toSecs(b[map.time]),price=+b[map.price],vol=+b[map.vol];
    if(!isFinite(dn)||!isFinite(sec)||!isFinite(price)||!isFinite(vol)){skipped++;continue}
    const same=(+s[map.price]===price)&&(+s[map.vol]===vol)&&String(s[map.time]).trim()===String(b[map.time]).trim()&&String(s[map.date]).trim()===String(b[map.date]).trim()&&(!map.tday||String(s[map.tday]).trim()===String(b[map.tday]).trim());
    if(!same)incons++;
    minDay=Math.min(minDay,dn);
    const ip=String(b[map.ins]).split('-'),ins=ip.length>=4?ip.slice(2).join('-'):String(b[map.ins]);
    tmp.push({dn,sec,ins,price:Math.round(price*1e6)/1e6,vol,b,s,id,same});
  }
  if(!tmp.length)return {error:t('noRows')};
  const rows=tmp.map(x=>[(x.dn-minDay)*86400+x.sec,x.ins,x.price,x.vol,
    String(x.b[map.firm]),String(x.b[map.inv]),String(x.b[map.user]),String(x.b[map.brk]),
    String(x.s[map.firm]),String(x.s[map.inv]),String(x.s[map.user]),String(x.s[map.brk]),
    x.id,map.order?String(x.b[map.order]):'',map.order?String(x.s[map.order]):'',x.same?1:0]);
  rows.sort((a,b)=>a[0]-b[0]);
  const td=map.tday?String(tmp[0].b[map.tday]).trim():'';
  return {rows,meta:{file:fileName,baseDay:minDay,tradingDay:td,sample:false,incons},skipped,total:objs.length};
}
async function handleFile(file){
  if(!file)return;
  if(!/\.(xls|xlsx|csv)$/i.test(file.name)){setStatus(t('readFail'),'err');return}
  setStatus(t('parsing',{f:file.name}));
  try{
    await new Promise(r=>setTimeout(r,30));
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    let res=null,lastErr=null;
    for(const n of wb.SheetNames){
      const objs=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''});
      if(!objs.length)continue;
      const r=parseTrades(objs,file.name);
      if(r.error){lastErr=r.error;continue}
      res=r;break;
    }
    if(!res){setStatus(lastErr||t('noRows'),'err');return}
    loadData(res.rows,res.meta);
    setStatus(t('loaded',{f:file.name,n:fmt(res.rows.length),r:fmt(res.total)})+(res.skipped?t('skipped',{k:fmt(res.skipped)}):'')+(res.meta.incons?t('inconsNote',{n:fmt(res.meta.incons)}):''),'ok');
  }catch(e){setStatus(t('readFail'),'err')}
}

/* ---------- parsing ---------- */
function csvRows(text){const rows=[];let row=[],f='',q=false;const first=text.split(/\r?\n/,1)[0];const delim=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===delim){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function csvObjs(text){const r=csvRows(text.replace(/^﻿/,''));if(!r.length)return[];const h=r[0].map(s=>s.trim());
 return r.slice(1).map(x=>{const o={};h.forEach((k,i)=>{const v=x[i]==null?'':x[i].trim();o[k]=v!==''&&/^-?\d+(\.\d+)?$/.test(v)&&!/^0\d/.test(v)?+v:v});return o})}

async function readObjs(file){

 for(const n of wb.SheetNames){const o=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''});if(o.length)return o}
 return[]}
async function importFile(file){

 {const rk=rcDetect(objs);if(rk&&rk!=='etr')return await rcImportObjs(objs,file.name,rk)}

async function importTrades(objs,name){

 BO.days[key]=rec;try{await IDB.set('day:'+key,rec)}catch(e){persist=false}

async function importWO(objs,name){
 const by={};Object.keys(objs[0]).forEach(k=>by[norm(k)]=k);
 const need=['investorid','instrumentid','bs','volumetotal'];const miss=need.filter(n=>!by[n]);if(miss.length)throw new Error('Kolom W.O kurang: '+miss.join(', '));
 let key=null;if(by.tradingday){const v=String(objs[0][by.tradingday]).trim();if(/^\d{8}$/.test(v))key=v}
 if(!key){const m=name.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)key=m[1]+m[2]+m[3]}
 if(!key)throw new Error('Tanggal W.O tidak terbaca (butuh kolom Trading Day atau tanggal di nama file)');
 const agg={};let n=0;
 for(const o of objs){if(by.orderstatus&&String(o[by.orderstatus]).trim()!=='3')continue;
  const inv=String(o[by.investorid]).trim(),ins=shortIns(o[by.instrumentid]),sd=String(o[by.bs]).trim().toUpperCase()[0],v=+o[by.volumetotal];if(!inv||!isFinite(v)||(sd!=='B'&&sd!=='S'))continue;

/* ---------- engine ---------- */
const mplOf=ins=>{const c=BO.cfg;return +(c.mpl[ins]!==undefined&&c.mpl[ins]!==''?c.mpl[ins]:c.mplProd[pOf(ins)])||0};
const multOf=p=>{const v=+BO.cfg.mult[p];return v>0?v:1};
const feeOf=p=>{const v=BO.cfg.fee[p];return v===undefined||v===''?(+BO.cfg.feeDef||0):+v};
/* aturan fee/PPN/PPh: paling spesifik menang (sub-account > kontrak > produk > CM > sisi); tiap parameter dipilih sendiri-sendiri */
const FC=new Map();
function feeRule(cm,sub,ins,side){const C=BO.cfg,key=cm+'|'+sub+'|'+ins+'|'+side;let r=FC.get(key);if(r)return r;const p=pOf(ins),b={fee:[-1,undefined],ppn:[-1,undefined],pph:[-1,undefined]};
 for(const x of C.feeRules||[]){if(x.sub&&x.sub!==sub)continue;if(x.cm&&x.cm!==cm)continue;if(x.ins&&x.ins!==ins&&x.ins!==p)continue;if(x.side&&x.side!==side)continue;
  const sc=(x.sub?16:0)+(x.ins?(x.ins===ins?8:4):0)+(x.cm?2:0)+(x.side?1:0);for(const k of['fee','ppn','pph'])if(x[k]!==undefined&&x[k]!==''&&x[k]!==null&&sc>=b[k][0])b[k]=[sc,+x[k]]}
 r={fee:b.fee[1]!==undefined?b.fee[1]:feeOf(p),ppn:b.ppn[1]!==undefined?b.ppn[1]:(+C.ppnDef||0),pph:b.pph[1]!==undefined?b.pph[1]:(+C.pphDef||0)};FC.set(key,r);return r}
function allDays(){const s=new Set([...Object.keys(BO.days),...Object.keys(BO.wo)]);for(const x of BO.cfg.transfers)s.add(x.d);for(const d in BO.cfg.settle)if(Object.keys(BO.cfg.settle[d]||{}).length)s.add(d);return[...s].sort()}
function zoneOf(eq,mg){const C=BO.cfg;if(mg<=0)return eq<0?'Stop Out':'Aman';const r=eq/mg*100;if(eq<=0||r<=C.so)return'Stop Out';if(r<=C.mc)return'Margin Call';if(r<C.warn)return'Waspada';return'Aman'}
function prices(days){const last={},out={};
 for(const d of days){const cur={},ts={};const D=BO.days[d];if(D)for(const r of D.rows){if(ts[r[1]]===undefined||r[0]>=ts[r[1]]){ts[r[1]]=r[0];cur[r[1]]=r[2]}}
  const S=BO.cfg.settle[d]||{},o={};
  for(const k of new Set([...Object.keys(last),...Object.keys(cur),...Object.keys(S)])){const sv=S[k];
   if(sv!==undefined&&sv!==''&&isFinite(+sv)){o[k]={p:+sv,s:'S'};last[k]=+sv}else if(cur[k]!==undefined){o[k]={p:cur[k],s:'T'};last[k]=cur[k]}else o[k]={p:last[k],s:'C'}}
  out[d]=o}

function compute(){
 if(calc)return calc;FC.clear();
 const days=allDays(),P=prices(days),C=BO.cfg,F={},info={};
 const add=(inv,f)=>{(F[inv]||(F[inv]={}));(F[inv][f.d]||(F[inv][f.d]=[])).push(f);const i=info[inv]||(info[inv]={firms:new Set(),brks:new Set()});i.firms.add(f.firm);i.brks.add(f.brk)};
 for(const d of days){const D=BO.days[d];if(!D)continue;for(const r of D.rows){
  add(r[5],{d,ts:r[0],ins:r[1],sd:1,px:r[2],vol:r[3],tid:r[12],ord:r[13],firm:r[4],brk:r[7],cp:r[9]});
  add(r[9],{d,ts:r[0],ins:r[1],sd:-1,px:r[2],vol:r[3],tid:r[12],ord:r[14],firm:r[8],brk:r[11],cp:r[5]})}}
 const invs=new Set(Object.keys(F));C.transfers.forEach(x=>{if((x.lv||'I')==='I')invs.add(x.inv)});C.open.forEach(x=>invs.add(x.inv));
 const series={};
 for(const inv of invs){
  let cash=0,cReal=0,cFee=0,cFeeG=0,cPpn=0,cPph=0,cCr=0,cDr=0,cDep=0,cWdr=0,cAdj=0,prevU=0,prevEq=0;const pos={};
  C.open.filter(o=>o.inv===inv).forEach(o=>{pos[o.ins]={q:+o.q,avg:+o.avg,lots:[{q:Math.abs(+o.q),px:+o.avg}]}});
  const trs=C.transfers.filter(x=>x.inv===inv&&(x.lv||'I')==='I'),rec=[];
  for(const d of days){
   let cr=0,dr=0,dep=0,wdr=0,aK=0,aD=0;trs.forEach(x=>{if(x.d===d){const a=+x.amt,b=catOf(x);if(x.t==='K')cr+=a;else dr+=a;if(b==='dep')dep+=a;else if(b==='wd')wdr+=a;else if(b==='adjK')aK+=a;else aD+=a}});
   const fl=((F[inv]||{})[d]||[]).slice().sort((a,b)=>a.ts-b.ts||(a.tid>b.tid?1:-1));
   let real=0,fee=0,feeG=0,ppnT=0,pphT=0,bl=0,sl=0;const per={},fills=[];
   for(const f of fl){const p=pOf(f.ins),mu=multOf(p),R=feeRule(f.brk,inv,f.ins,f.sd>0?'B':'S'),fg=R.fee*f.vol,pn=fg*R.ppn/100,ph=fg*R.pph/100,fr=fg+(C.ppnIn?pn:0)+(C.pphIn?ph:0);fee+=fr;feeG+=fg;ppnT+=pn;pphT+=ph;
    const s=per[f.ins]||(per[f.ins]={buy:0,sell:0,bv:0,sv:0,fee:0,real:0,n:0});s.n++;s.fee+=fr;if(f.sd>0){s.buy+=f.vol;s.bv+=f.vol*f.px;bl+=f.vol}else{s.sell+=f.vol;s.sv+=f.vol*f.px;sl+=f.vol}
    const ps=pos[f.ins]||(pos[f.ins]={q:0,avg:0,lots:[]}),q=ps.q,sg=f.sd*f.vol;let rl=0;
    if(q===0)ps.lots=[];

function Grid(el,o){

 const strip=h=>String(h).replace(/<[^>]*>/g,'');
 function test(c,r,expr){expr=expr.trim();if(!expr)return true;const v=r[c.k];
  if(c.t==='n'){let m=expr.match(/^(>=|<=|!=|>|<|=)\s*(-?[\d.,]+)$/);const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'));
   const val=+v;
   if(m){let x=m[2];x=/,/.test(x)||(x.match(/\./g)||[]).length>1?num(x):parseFloat(x);return m[1]==='>'?val>x:m[1]==='<'?val<x:m[1]==='>='?val>=x:m[1]==='<='?val<=x:m[1]==='='?val===x:val!==x}
   m=expr.match(/^(-?[\d.]+)\.\.(-?[\d.]+)$/);if(m)return val>=+m[1]&&val<=+m[2]}
  const txt=strip(disp(c,r)).toLowerCase(),raw=String(v==null?'':v).toLowerCase();
  if(expr[0]==='=')return raw===expr.slice(1).toLowerCase()||txt===expr.slice(1).toLowerCase();

  return expr.toLowerCase().split(',').some(t=>{t=t.trim();return t&&(txt.includes(t)||raw.includes(t))})}

  vis=rows.filter(r=>fs.every(([i,v])=>test(cols[i],r,v))&&(!q||cols.some(c=>(strip(disp(c,r))+' '+(r[c.k]==null?'':r[c.k])).toLowerCase().includes(q))));

  const tf=q$(el,'tfoot');if(o.tot&&vis.length){const TT=o.tot(vis);tf.innerHTML='<tr>'+cols.map((c,i)=>`<td class="${c.t==='n'?'':'tl'}"><b>${i===0&&TT[c.k]===undefined?T('Total'):TT[c.k]===undefined?'':E(c.f?c.f(TT[c.k],TT):c.t==='n'?(c.d===undefined?int(TT[c.k]):nf(TT[c.k],c.d)):TT[c.k])}</b></td>`).join('')+'</tr>'}else tf.innerHTML='';
  q$(el,'.gcnt').textContent=`${int(vis.length)} ${T('dari')} ${int(rows.length)} ${T('baris')}`;q$(el,'.gpg').textContent=`${S.page+1}/${pages}`;q$(el,'.gp').disabled=S.page<=0;q$(el,'.gn').disabled=S.page>=pages-1;
  el.querySelectorAll('th[data-s]').forEach(th=>{th.classList.toggle('on',+th.dataset.s===S.sort);th.dataset.d=+th.dataset.s===S.sort?(S.dir>0?' ▲':' ▼'):''})}
 function build(){el.classList.add('grid');el.innerHTML=`<div class="toolbar noprint"><input type="search" class="gq" placeholder="${T('Cari di semua kolom…')}" value="${E(S.q)}"><span class="foot gcnt"></span><div class="pager"><button class="gp">‹</button><span class="gpg"></span><button class="gn">›</button></div></div><div class="tablewrap"><table><thead><tr>${cols.map((c,i)=>`<th data-s="${i}" class="${c.t==='n'?'':'tl'}" title="${T('Klik untuk urut')}">${E(T(c.h))}</th>`).join('')}</tr><tr class="fr noprint">${cols.map((c,i)=>`<th class="${c.t==='n'?'':'tl'}"><input class="gf" data-c="${i}" value="${E(S.f[i]||'')}" placeholder="${c.t==='n'?'>0, 1..9':T('cari')}"></th>`).join('')}</tr></thead><tbody></tbody><tfoot></tfoot></table></div>`;

function feeRows(){const c=compute(),A={};
 for(const inv of c.invs)for(const x of recsIn(inv,ST.from,ST.to))for(const f of x.fills){const side=f.sd>0?'B':'S',key=[f.d,f.brk,f.firm,inv,f.ins,side].join('|');
  const a=A[key]||(A[key]={d:f.d,cm:f.brk,firm:f.firm,sub:inv,ins:f.ins,prod:pOf(f.ins),side,n:0,lots:0,gross:0,ppn:0,pph:0,total:0});a.n++;a.lots+=f.vol;a.gross+=f.feeG;a.ppn+=f.ppn;a.pph+=f.pph;a.total+=f.fee}
 return Object.values(A)}
function feeAgg(mode,rows){rows=rows||feeRows();const [K,At]=FSPEC[mode],A={};
 for(const r of rows){const key=K.map(k=>r[k]).join('|'),a=A[key]||(A[key]={...Object.fromEntries([...K,...At].map(k=>[k,r[k]])),n:0,lots:0,gross:0,ppn:0,pph:0,total:0});a.n+=r.n;a.lots+=r.lots;a.gross+=r.gross;a.ppn+=r.ppn;a.pph+=r.pph;a.total+=r.total}
 return Object.values(A).map(a=>({...a,avg:a.lots?a.gross/a.lots:null})).sort((x,y)=>y.gross-x.gross)}
const FNUM=[{k:'n',h:'Fill',t:'n'},{k:'lots',h:'Lot',t:'n'},{k:'avg',h:'Fee/lot rata²',t:'n',d:4},{k:'gross',h:'Fee bruto',t:'n',d:2},{k:'ppn',h:'PPN',t:'n',d:2},{k:'pph',h:'PPh',t:'n',d:2},{k:'total',h:'Dibebankan ke akun',t:'n',d:2}];

const feeTot=v=>{const s=k=>v.reduce((a,x)=>a+(+x[k]||0),0);return{n:s('n'),lots:s('lots'),avg:s('lots')?s('gross')/s('lots'):null,gross:s('gross'),ppn:s('ppn'),pph:s('pph'),total:s('total')}};

function runKind(kind,objs,label){const C=BO.cfg,rep={ok:0,skip:0,err:[]},er=(i,m)=>rep.err.push(`Baris ${i+2}: ${m}`);

   if(has(r.margin)){const v=pNum(r.margin);if(!(v>=0)){er(i,'Margin tidak valid');return}C.mplProd[p]=v;ch++}
   if(has(r.mult)){const v=pNum(r.mult);if(!(v>0)){er(i,'Nilai per poin tidak valid');return}C.mult[p]=v;ch++}
   if(has(r.fee)){const v=pNum(r.fee);if(!(v>=0)){er(i,'Fee tidak valid');return}C.fee[p]=v;ch++}
   ch?rep.ok++:rep.skip++}
  else if(kind==='feeRule'){const wc=v=>{const t=String(v==null?'':v).trim();return t==='*'||/^(all|semua)$/i.test(t)?'':t},sd=wc(r.side).toUpperCase(),side=/^(B|BUY|BELI)$/.test(sd)?'B':/^(S|SELL|JUAL)$/.test(sd)?'S':sd===''?'':'?';

   const x={cm:wc(r.cm),sub:wc(has(r.sub)?r.sub:r.investor),ins:(()=>{const t=wc(r.kontrak);return t?shortIns(t):''})(),side};let bad=false;
   for(const k of['fee','ppn','pph']){if(has(r[k])){const v=pNum(r[k]);if(!(v>=0)){er(i,k.toUpperCase()+' tidak valid');bad=true}else x[k]=v}else x[k]=''}
   if(bad)return;const same=y=>y.cm===x.cm&&y.sub===x.sub&&y.ins===x.ins&&y.side===x.side;C.feeRules=C.feeRules||[];
   if(x.fee===''&&x.ppn===''&&x.pph===''){const n0=C.feeRules.length;C.feeRules=C.feeRules.filter(y=>!same(y));n0!==C.feeRules.length?rep.ok++:rep.skip++;return}
   const j=C.feeRules.findIndex(same);if(j>=0){if(['fee','ppn','pph'].every(k=>C.feeRules[j][k]===x[k])){rep.skip++;return}C.feeRules[j]={...x,id:C.feeRules[j].id}}else C.feeRules.push({...x,id:C.nid++});rep.ok++}

  else if(kind==='posisi'){const inv=String(r.investor||'').trim(),k=shortIns(r.kontrak||''),q=pNum(r.netlot),a=pNum(r.avg);if(!inv||!k||!isFinite(q)||!isFinite(a)){er(i,'Investor/kontrak/net lot/harga tidak valid');return}C.open=C.open.filter(x=>!(x.inv===inv&&x.ins===k));if(q!==0)C.open.push({inv,ins:k,q,avg:a});rep.ok++}

   const adj=cat.startsWith('Adjustment');let why=String(r.alasan||'').trim();{const EW={'fee correction':'Koreksi fee','p&l correction':'Koreksi P&L','interest':'Bunga','bank charges':'Biaya bank','bank fee':'Biaya bank','penalty':'Penalti','transfer between accounts':'Transfer antar akun','other':'Lainnya'};why=EW[why.toLowerCase()]||why}if(adj&&!why){er(i,'Adjustment wajib diberi alasan');return}

  if(!any)out.push('✗ '+f.name+': format tidak dikenali — gunakan template')}catch(e){out.push('✗ '+f.name+': '+(e&&e.message||e))}}

function perfOf(inv){const S=periodStat(inv),rs=S.rs;if(!rs.length||!S.end)return null;
 const daily=rs.map(x=>({d:x.d,pnl:x.real-x.fee+x.dU,eq:x.equity,mg:x.mgT,ratio:x.ratio,zone:x.zone}));
 let cum=0,peak=0,dd=0,ddd='',best=null,worst=null;const cumS=[];
 daily.forEach(r=>{cum+=r.pnl;cumS.push(cum);if(cum>peak)peak=cum;if(peak-cum>dd){dd=peak-cum;ddd=r.d}if(!best||r.pnl>best.pnl)best=r;if(!worst||r.pnl<worst.pnl)worst=r});
 const cl=rs.flatMap(x=>x.fills).filter(f=>f.real!==0),wins=cl.filter(f=>f.real>0),loss=cl.filter(f=>f.real<0),gw=wins.reduce((s,f)=>s+f.real,0),gl=-loss.reduce((s,f)=>s+f.real,0);
 const n=daily.length,mean=cum/n,sd=n>1?Math.sqrt(daily.reduce((s,r)=>s+(r.pnl-mean)**2,0)/(n-1)):null;
 const util=daily.filter(r=>r.eq>0).map(r=>r.mg/r.eq*100),minR=daily.filter(r=>r.ratio!=null).reduce((m,r)=>!m||r.ratio<m.ratio?r:m,null),base=S.openEq+S.dep,zones={};daily.forEach(r=>zones[r.zone]=(zones[r.zone]||0)+1);
 const lots=S.buy+S.sell;
 return{S,daily,cumS,eqS:daily.map(r=>r.eq),net:cum,roi:base>0?cum/base*100:null,dd,ddd,best,worst,closes:cl.length,wins:wins.length,loss:loss.length,winRate:cl.length?wins.length/cl.length*100:null,avgWin:wins.length?gw/wins.length:null,avgLoss:loss.length?-gl/loss.length:null,pf:gl>0?gw/gl:(gw>0?Infinity:null),maxWin:wins.length?Math.max(...wins.map(f=>f.real)):null,maxLoss:loss.length?Math.min(...loss.map(f=>f.real)):null,mean,sd,activeDays:rs.filter(x=>x.n>0).length,days:n,avgUtil:util.length?util.reduce((a,b)=>a+b,0)/util.length:null,maxUtil:util.length?Math.max(...util):null,minR,zones,lots,fills:S.n,feeLot:lots?S.fee/lots:null,feePct:S.real>0?S.fee/S.real*100:null}}
function perfItems(P){const o=(l,t,raw,n,cls)=>({l,t,raw,n:n||'',cls:cls||''}),z=Object.entries(P.zones).map(([k,v])=>T(k)+' '+v).join(' · ');
 return[
 o('Net P&L (periode)',mny(P.net),P.net,'Realized − fee + Δ unrealized',P.net<0?'neg':P.net>0?'pos':''),
 o('ROI periode',P.roi==null?'-':nf(P.roi,2)+'%',P.roi==null?'':P.roi,'Net P&L ÷ (equity awal + setoran)'),

 o('Rata² P&L harian',mny(P.mean),P.mean,P.sd==null?'':'± '+mny(P.sd)+' (stdev)'),

 o('Risk ratio terendah',P.minR?pctf(P.minR.ratio):'-',P.minR?P.minR.ratio:'',P.minR?dFmt(P.minR.d):''),
 o('Hari per zona',z||'-',z,'')]}
const cmp=v=>{const a=Math.abs(v);return a>=1e6?nf(v/1e6,1)+'M':a>=1e3?nf(v/1e3,1)+'k':nf(v,0)};
function chartSvg(vals,labels,bars){const W=600,H=170,pl=54,pr=10,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=vals.length;if(!n)return'';
 let lo=Math.min(...vals),hi=Math.max(...vals);if(bars){lo=Math.min(0,lo);hi=Math.max(0,hi)}if(hi===lo){hi+=1;lo-=1}const sp=hi-lo,y=v=>pt+ih-(v-lo)/sp*ih,x=i=>pl+(n===1?iw/2:i*iw/(n-1));
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:230px" role="img">`;
 for(let i=0;i<=3;i++){const v=lo+sp*i/3,yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${cmp(v)}</text>`}
 if(bars){const bw=Math.min(40,iw/n*.6),zy=y(0);s+=`<line x1="${pl}" x2="${W-pr}" y1="${zy}" y2="${zy}" stroke="var(--ink3)"/>`;vals.forEach((v,i)=>{const cx=pl+(i+.5)*iw/n,yy=y(v);s+=`<rect x="${cx-bw/2}" y="${Math.min(yy,zy)}" width="${bw}" height="${Math.max(1,Math.abs(yy-zy))}" rx="2" fill="${v>=0?'var(--long)':'var(--short)'}"><title>${E(dFmt(labels[i]))}: ${mny(v)}</title></rect>`})}
 else{s+=`<polyline fill="none" stroke="var(--focus)" stroke-width="2" points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--focus)" stroke="var(--surface)" stroke-width="2"><title>${E(dFmt(labels[i]))}: ${mny(v)}</title></circle>`).join('')}
 const xp=i=>bars?pl+(i+.5)*iw/n:x(i);[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{s+=`<text x="${xp(i)}" y="${H-6}" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}">${E(dFmt(labels[i]))}</text>`});
 return s+'</svg>'}
function perfHTML(P){const it=perfItems(P);
 return `<div class="kpis">${it.map(i=>`<div class="kpi"><div class="lbl">${E(i.l)}</div><div class="v ${i.cls}" style="font-size:18px">${E(i.t)}</div><div class="n">${E(i.n)}</div></div>`).join('')}</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px"><div><div class="lbl" style="margin-bottom:4px">Equity harian</div>${chartSvg(P.eqS,P.daily.map(r=>r.d),false)}</div><div><div class="lbl" style="margin-bottom:4px">P&amp;L harian (realized − fee + Δ unrealized)</div>${chartSvg(P.daily.map(r=>r.pnl),P.daily.map(r=>r.d),true)}</div></div>`}

 return{m,re:new RegExp(keys.map(k=>/^[\p{L}\p{N}]/u.test(k)?'(?<![\\p{L}\\p{N}])'+k+(/[\p{L}\p{N}]$/u.test(k)?'(?![\\p{L}\\p{N}])':''):k).join('|'),'gu')}})();
const trCache=new Map();
const trOut=new Set();
T=s=>{if(typeof s!=='string'||lang!=='en'||!s||trOut.has(s))return s;let r=trCache.get(s);if(r!==undefined)return r;r=EN_RE.m.has(s)?EN_RE.m.get(s):s.replace(EN_RE.re,x=>EN_RE.m.get(x)||x);if(trCache.size>5000)trCache.clear();trCache.set(s,r);if(r!==s)trOut.add(r);return r};
function trDom(el){if(lang!=='en')return;const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;const todo=[];while(n=w.nextNode()){if(n.nodeValue.trim()&&/[A-Za-z]/.test(n.nodeValue)){const p=n.parentNode&&n.parentNode.nodeName;if(p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA')continue;todo.push(n)}}
 todo.forEach(n=>{const v=n.nodeValue,lead=v.match(/^\s*/)[0],tail=v.match(/\s*$/)[0],t=v.trim(),r=T(t);if(r!==t)n.nodeValue=lead+r+tail});
 el.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>{for(const a of ['placeholder','title','aria-label']){const v=e.getAttribute(a);if(v){const r=T(v);if(r!==v)e.setAttribute(a,r)}}})}

function etpLegs(d){const D=BO.days[d],out=[];if(!D)return out;const base=D.baseDay*86400;for(const r of D.rows){const ts=base+r[0];out.push([ts,r[7],r[5],r[1],1,r[3],r[2],r[4],r[12],d],[ts,r[11],r[9],r[1],-1,r[3],r[2],r[8],r[12],d])}return out}
function falLegs(d){const R=RC.ftr[d],out=[];if(!R)return out;const off=(+rcCfg().foff||0)*3600;for(const l of R.rows)out.push([l[0]+off,l[1],l[2],l[3],l[4],l[5],l[6],l[7],l[8],d]);return out}

function rcLegs(src,days){const o=[];for(const d of days||rcRange())for(const l of legsOf(src,d))o.push(l);return o}
function crossOf(legs){const X=new Map();for(const l of legs){const k=[l[9],l[1],l[2],l[3],l[5],l[6],l[0]].join('|');let x=X.get(k);if(!x){x={day:l[9],cm:l[1],pa:l[2],con:l[3],qty:l[5],price:l[6],ts:l[0],nb:0,ns:0};X.set(k,x)}if(l[4]>0)x.nb++;else x.ns++}
 return[...X.values()].filter(x=>x.nb&&x.ns).map(x=>({...x,n:Math.min(x.nb,x.ns),lots:Math.min(x.nb,x.ns)*x.qty}))}

 return[...A.values()].map(a=>{const ex1=ex.includes(a.cm),eb=a.buy-(ex1?a.cross:0),es=a.sell-(ex1?a.cross:0);return{...a,npa:a.pas.size,ebuy:eb,esell:es,vol:eb+es,gross:a.buy+a.sell}})}
